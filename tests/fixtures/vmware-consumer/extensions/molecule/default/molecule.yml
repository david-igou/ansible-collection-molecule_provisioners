---
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: create.yml
    prepare: prepare.yml
    destroy: destroy.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  name: default
  create_sequence:
    - create
  destroy_sequence:
    - destroy
  test_sequence:
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
