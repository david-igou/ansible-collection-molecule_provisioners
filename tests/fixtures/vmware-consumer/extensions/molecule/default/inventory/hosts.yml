---
all:
  children:
    molecule:
      vars:
        mp_backend: vmware
        mp_defaults:
          vmware:
            datacenter: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_DATACENTER') }}"
            cluster: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_CLUSTER') }}"
            folder: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_FOLDER') }}"
            datastore: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_DATASTORE') }}"
            bootstrap:
              method: guestinfo
            guest:
              credentials:
                username: molecule
            networks:
              - name: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_NETWORK') }}"
                type: dhcp
        mp_vmware_provision_timeout: 900
        mp_vmware_tools_timeout: 180
        mp_vmware_cleanup_timeout: 600
      hosts:
        ubuntu:
          mp:
            vmware:
              template: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_TEMPLATE') }}"
        centos:
          mp:
            vmware:
              template: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_SECOND_TEMPLATE') }}"
