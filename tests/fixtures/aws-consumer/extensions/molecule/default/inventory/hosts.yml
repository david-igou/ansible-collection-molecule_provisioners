---
all:
  children:
    molecule:
      vars:
        mp_backend: aws
        mp_defaults:
          aws:
            region: us-east-2
            expected_account_id: "{{ lookup('ansible.builtin.env', 'MP_TEST_AWS_ACCOUNT_ID') }}"
            image_id: "{{ lookup('ansible.builtin.env', 'MP_TEST_AWS_IMAGE') }}"
            instance_type: t3.micro
            management_cidrs:
              - "{{ lookup('ansible.builtin.env', 'MP_TEST_AWS_CIDR') }}"
      hosts:
        instance:
          mp:
            aws: {}
