---
all:
  children:
    molecule:
      vars:
        mp_backend: qemu
      hosts:
        instance:
          mp:
            qemu:
              image: >-
                {{ lookup('env', 'MP_TEST_QEMU_IMAGE') | default(
                   'https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2', true) }}
              ssh_user: debian
              memory: 768
              cpus: 1
              data_disks:
                - name: consumer-data
                  size: 32M
                  serial: consumer-data
