---
# Renders the _ansible_port expression from _create_vm_dictionary.yml against
# a synthetic spec. The synthetic __mp_kubevirt_svc has nodePort=31234 so we
# can detect when NodePort-mode wrongly falls through to the None branch.
# Keep this expression in sync with the one in _create_vm_dictionary.yml.
- name: Render ssh_service port resolution from _create_vm_dictionary.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    __mp_kubevirt_svc:
      resources:
        - spec:
            ports:
              - nodePort: 31234
    _connection: "{{ spec.connection | default('ssh') }}"
    _service_mode: "{{ spec.ssh_service.type | default('NodePort') }}"
    _guest_port: "{{ 5986 if _connection in ['psrp', 'winrm'] else 22 }}"
    _ansible_port: >-
      {{ (spec.ssh_service.port | default(_guest_port))
         if _service_mode in ['None', 'PodIP']
         else (__mp_kubevirt_svc.resources[0].spec.ports[0].nodePort) }}
  tasks:
    - name: Emit JSON for the python harness
      ansible.builtin.copy:
        content: "{{ {'ansible_port': _ansible_port | int} | to_json }}"
        dest: "{{ output_path }}"
        mode: "0600"
