---
# Exercise the real runtime builder with synthetic API responses.
- name: Render runtime inventory without a cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    item: instance
    __mp_kubevirt_node_ip: "10.9.9.9"
    __mp_kubevirt_pod_network_name: default
    __mp_kubevirt_runtime_hosts: {}
    mp_kubevirt_ssh_key_path: /tmp/identity_file
    __mp_kubevirt_svc:
      resources:
        - spec:
            ports:
              - name: http
                nodePort: 31235
              - name: management
                nodePort: 31234
              - name: dns
                nodePort: 31236
    __mp_kubevirt_vmi:
      resources:
        - status:
            interfaces:
              - name: default
                ipAddress: "10.130.0.42"
    _mp_specs:
      instance: "{{ {'ssh_user': 'cloud-user'} | combine(spec) }}"
  tasks:
    - name: Build the runtime entry
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../roles/kubevirt/tasks/_build_runtime.yml"

    - name: Emit the runtime entry for assertions
      ansible.builtin.copy:
        content: "{{ __mp_kubevirt_runtime_hosts[item] | to_json }}"
        dest: "{{ output_path }}"
        mode: "0600"
