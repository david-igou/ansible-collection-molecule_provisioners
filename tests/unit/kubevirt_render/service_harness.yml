---
- name: Render the run-owned management and application Service
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    item: instance
    _mp_specs:
      instance: "{{ {'namespace': 'molecule'} | combine(spec) }}"
  tasks:
    - name: Build the Service
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../roles/kubevirt/tasks/_build_service.yml"

    - name: Emit the Service for assertions
      ansible.builtin.copy:
        content: "{{ __mp_kubevirt_service | to_json }}"
        dest: "{{ output_path }}"
        mode: "0600"
