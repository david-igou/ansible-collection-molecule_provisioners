---
all:
  children:
    molecule:
      hosts:
        ubuntu-process-slirp:
          mp:
            qemu:
              image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
              image_checksum: "sha256:6e7016f2c9f4d3c00f48789eb6b9043ba2172ccc1b6b1eaf3ed1e29dd3e52bb3"
              driver: process
              memory: 1024
              cpus: 2
              ssh_user: ubuntu
              network:
                mode: slirp
  vars:
    mp_backend: qemu
    mp_defaults:
      qemu:
        ssh_user: ubuntu
