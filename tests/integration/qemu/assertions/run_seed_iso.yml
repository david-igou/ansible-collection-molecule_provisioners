---
- name: Exercise seed ISO build
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    molecule_ephemeral_directory: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY')
                                       | default('/tmp/molecule-fake-ephemeral', true) }}"
    _fake_image_src: "{{ molecule_ephemeral_directory }}/qemu-fake-image.qcow2"
  tasks:
    - name: Ensure ephemeral dir
      ansible.builtin.file:
        path: "{{ molecule_ephemeral_directory }}"
        state: directory
        mode: "0755"
    - name: Create a tiny fake qcow2
      ansible.builtin.copy:
        content: "QFI\xfb fake qcow2"
        dest: "{{ _fake_image_src }}"
        mode: "0644"
    - name: Include role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../../roles/qemu/defaults/main.yml"
    - name: Surface mp_defaults
      ansible.builtin.set_fact:
        mp_defaults: "{{ hostvars[groups['molecule'][0]].mp_defaults | default({}) }}"
    # Override template dir so include_tasks-based tests find templates without role_path.
    - name: Set template dir override for include_tasks context
      ansible.builtin.set_fact:
        mp_qemu_template_dir_override: "{{ playbook_dir }}/../../../../roles/qemu/templates"
    - name: Run spec merge
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../roles/qemu/tasks/_spec_merge.yml"
    - name: Run validation
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../roles/qemu/tasks/_validate.yml"
    # _seed_iso.yml only needs the merged spec (not base_image_path); skip image cache
    # to avoid the shared-/tmp race condition with test_image_cache.
    - name: Run seed ISO phase only
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../roles/qemu/tasks/_seed_iso.yml"

    - name: Stat the seed ISO for the first host
      ansible.builtin.stat:
        path: "{{ _mp_specs[groups['molecule'][0]].seed_iso_path }}"
      register: __iso
    - name: Assert seed ISO exists and is non-empty
      ansible.builtin.assert:
        that:
          - __iso.stat.exists
          - __iso.stat.size > 0
    - name: Stat user-data
      ansible.builtin.stat:
        path: "{{ molecule_ephemeral_directory }}/{{ groups['molecule'][0] }}-cidata/user-data"
      register: __ud
    - name: Assert user-data exists
      ansible.builtin.assert:
        that: __ud.stat.exists
    - name: Read user-data
      ansible.builtin.slurp:
        src: "{{ molecule_ephemeral_directory }}/{{ groups['molecule'][0] }}-cidata/user-data"
      register: __ud_content
    - name: Assert user-data has the expected user and SSH key
      ansible.builtin.assert:
        that:
          # ssh_user is now rendered as a quoted YAML scalar to guard against
          # names that YAML would coerce to bool/null (yes, no, null, ...).
          - "'name: \"ubuntu\"' in (__ud_content.content | b64decode)"
          - "'ssh-ed25519' in (__ud_content.content | b64decode)"

    - name: Cleanup fake source
      ansible.builtin.file:
        path: "{{ _fake_image_src }}"
        state: absent
