---
all:
  children:
    molecule:
      hosts:
        mp-first:
          mp:
            vmware:
              template: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_TEMPLATE', default=Undefined) }}"
        mp-second:
          mp:
            vmware:
              template: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_SECOND_TEMPLATE', default=Undefined) }}"
              hardware:
                memory_mb: 3072
              networks:
                - name: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_NETWORK', default=Undefined) }}"
                - name: "{{ lookup('ansible.builtin.env', 'MP_TEST_VMWARE_NETWORK', default=Undefined) }}"
              disks:
                - size_gb: 30
                  type: thin
                - size_gb: 1
                  type: thin
