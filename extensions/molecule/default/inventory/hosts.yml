---
all:
  children:
    molecule:
      hosts:
        instance:
          mp:
            podman:
              image: docker.io/geerlingguy/docker-fedora41-ansible:latest
              # Override mp_defaults.podman.command (/sbin/init): this devcontainer
              # doesn't delegate /sys/fs/cgroup to rootless users, so PID 1 systemd
              # exits before prepare can connect. `systemd: always` is still set
              # and Config.SystemdMode is verified via podman inspect — only the
              # in-container init runtime is sidestepped.
              command: sleep infinity
              systemd: always
              cgroupns: host
              hostname: mp-instance
              tty: true
              detach: true
              etc_hosts:
                mp-extra-host: 10.0.0.42
              dns_servers:
                - 1.1.1.1
              security_opts:
                - seccomp=unconfined
              ulimits:
                - nofile=1024:2048
              pid_mode: private
              restart_policy: on-failure
              restart_retries: 3
              podman_network:
                - name: mp-test-net
                  subnet: 10.89.0.0/24
                  gateway: 10.89.0.1
              extra_opts:
                - --memory=128m
            kubevirt:
              # quay.io/kubevirt/fedora-cloud-container-disk-demo ships Python 3.8;
              # ansible-core requires 3.9+ on the target. Use a current Ubuntu cloud
              # image (matches docs/examples) and set ssh_user accordingly.
              boot_source:
                type: container_disk
                image: quay.io/containerdisks/ubuntu:24.04
              ssh_user: ubuntu
              cpu:
                cores: 2
              vm_overrides:
                metadata:
                  labels:
                    test.molecule-provisioners/exercise: vm_overrides
            qemu:
              # Immutable snapshot URL (NOT noble/current/, which is a moving daily build).
              # When bumping, update both the URL date segment and the matching checksum
              # from the same SHA256SUMS file at that release path.
              image: >-
                https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img
              image_checksum: "sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7"
            docker:
              image: docker.io/geerlingguy/docker-fedora41-ansible:latest
