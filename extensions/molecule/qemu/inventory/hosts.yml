---
all:
  children:
    molecule:
      hosts:
        mp-bios: {}
        mp-uefi:
          mp:
            qemu:
              firmware: uefi
              memory: 1536
              data_disks:
                - name: scratch
                  size: 1G
              extra_args:
                - -netdev
                - user,id=extra
                - -device
                - virtio-net-pci,netdev=extra,mac=52:54:00:12:34:99
