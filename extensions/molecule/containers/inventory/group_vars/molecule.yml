---
mp_backend: "{{ lookup('ansible.builtin.env', 'PROVISIONER') | default('podman', true) }}"

mp_defaults:
  podman:
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    network:
      - mp-selftest
    env:
      MP_LAYER: defaults
  docker:
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    networks:
      - name: mp-selftest
    env:
      MP_LAYER: defaults

mp_podman_networks:
  - name: mp-selftest
    subnet: 10.89.42.0/24
mp_docker_networks:
  - name: mp-selftest
    ipam_config:
      - subnet: 10.89.43.0/24
