---
# kv-plain uses mp_defaults only. kv-custom overrides the CPU count and
# exercises cloud-init user data, a custom interface, a data disk and
# vm_overrides.
all:
  children:
    molecule:
      hosts:
        kv-plain: {}
        kv-custom:
          mp:
            kubevirt:
              cpu:
                cores: 1
              cloud_init:
                user_data:
                  hostname: kv-custom-guest
                  users:
                    - name: ubuntu
                      groups:
                        - adm
                  runcmd:
                    - echo cloud-init-ran > /var/tmp/mp-marker
                network_data:
                  version: 2
                  ethernets:
                    mgmt:
                      match:
                        macaddress: "02:00:00:00:00:a1"
                      set-name: mgmt0
                      dhcp4: true
              interfaces:
                - name: default
                  masquerade: {}
                  macAddress: "02:00:00:00:00:a1"
              data_disks:
                - name: scratch
                  size: 2Gi
              vm_overrides:
                metadata:
                  labels:
                    molecule-provisioners/test: overridden
