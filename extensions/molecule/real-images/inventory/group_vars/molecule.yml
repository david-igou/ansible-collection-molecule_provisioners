---
mp_backend: "{{ lookup('env', 'PROVISIONER') | default('podman', true) }}"
mp_kubevirt_wait_timeout: 300
mp_qemu_wait_timeout: 300

# These non-init images don't run systemd, so PID 1 must be a long-lived
# no-op (set per-host as command: sleep infinity). We deliberately do NOT
# set privileged: true — the scenario's point is to exercise the role
# against minimal distro images without the systemd-init wrapper that
# the default scenario uses.
mp_defaults:
  kubevirt:
    namespace: "{{ lookup('env', 'MOLECULE_NAMESPACE') | default('molecule', true) }}"
    memory: 1Gi
    ssh_user: cloud-user
  qemu:
    cpus: 2
    memory: 1024
    ssh_user: ubuntu
