---
all:
  children:
    molecule:
      hosts:
        centos-stream10:
          mp:
            podman:
              image: quay.io/centos/centos:stream10
              command: sleep infinity
              hostname: c10-test
              tty: true
              ulimits:
                - nofile=2048:4096
              pid_mode: private
              restart_policy: on-failure
              restart_retries: 2
              labels:
                project: real-images
                role: server
              podman_network:
                - name: mp-real-images-net
                  subnet: 10.91.0.0/24
                  gateway: 10.91.0.1
              env:
                TEST_ROLE: server
                TEST_SCENARIO: real-images
            kubevirt:
              # Backend not exercised here; pinned to the same image string the
              # default scenario uses so the dispatcher's "every host has the
              # active backend block" check passes when only podman runs.
              boot_source:
                type: container_disk
                image: quay.io/containerdisks/ubuntu:24.04
              ssh_user: ubuntu
            qemu:
              image: >-
                https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img
              image_checksum: "sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7"
            docker:
              image: docker.io/geerlingguy/docker-fedora41-ansible:latest
        ubuntu-2604:
          mp:
            podman:
              image: docker.io/ubuntu:26.04
              command: sleep infinity
              hostname: u2604-test
              etc_hosts:
                test-peer: 10.91.0.10
              dns_servers:
                - 9.9.9.9
                - 8.8.8.8
              security_opts:
                - seccomp=unconfined
              extra_opts:
                - --memory=256m
              labels:
                project: real-images
                role: client
              podman_network:
                - name: mp-real-images-net
                  subnet: 10.91.0.0/24
                  gateway: 10.91.0.1
              env:
                TEST_ROLE: client
            kubevirt:
              boot_source:
                type: container_disk
                image: quay.io/containerdisks/ubuntu:24.04
              ssh_user: ubuntu
            qemu:
              image: >-
                https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img
              image_checksum: "sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7"
            docker:
              image: docker.io/geerlingguy/docker-fedora41-ansible:latest
