---
name: CI

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  all_green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout collection
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: ansible_collections/david_igou/molecule_provisioners
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ansible_collections/david_igou/molecule_provisioners/lint-requirements.txt

      - name: Install lint tools and collection dependencies
        working-directory: ansible_collections/david_igou/molecule_provisioners
        run: |
          python -m pip install -r lint-requirements.txt -r requirements.txt
          ansible-galaxy collection install \
            containers.podman kubernetes.core community.crypto community.docker community.general \
            ansible.netcommon community.routeros \
            'amazon.aws:>=9.0.0,<12.0.0' \
            'community.aws:>=9.0.0,<12.0.0' \
            'ansible.windows:>=2.5.0,<4.0.0'

      - name: Lint collection
        working-directory: ansible_collections/david_igou/molecule_provisioners
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: make lint
