---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch:
  # TO-DO: Below is an example cron scheduler. Uncomment and tweak it as per your requirement
  # schedule:
    # - cron: '0 0 * * *'

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@main
  unit-galaxy:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@main
  unit-source:
    uses: ansible-network/github_actions/.github/workflows/unit_source.yml@main
    with:
      collection_pre_install: >-
        git+https://github.com/ansible-collections/ansible.utils.git
  integration-podman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout into the canonical collection path
        uses: actions/checkout@v4
        with:
          path: ansible_collections/david_igou/molecule_provisioners

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible + molecule + pytest plumbing
        working-directory: ansible_collections/david_igou/molecule_provisioners
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule \
                      pytest pytest-ansible pytest-xdist

      - name: Install collection dependencies
        working-directory: ansible_collections/david_igou/molecule_provisioners
        run: |
          ansible-galaxy collection install \
            containers.podman kubernetes.core community.crypto

      - name: Run podman integration tests
        working-directory: ansible_collections/david_igou/molecule_provisioners
        env:
          PROVISIONER: podman
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: pytest tests/integration -v -k default
  integration-kubevirt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout into the canonical collection path
        uses: actions/checkout@v4
        with:
          path: ansible_collections/david_igou/molecule_provisioners

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible + molecule + pytest plumbing
        working-directory: ansible_collections/david_igou/molecule_provisioners
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule \
                      pytest pytest-ansible pytest-xdist kubernetes

      - name: Install collection dependencies
        working-directory: ansible_collections/david_igou/molecule_provisioners
        run: |
          ansible-galaxy collection install \
            containers.podman kubernetes.core community.crypto

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          cluster_name: kubevirt-ci
          wait: 120s

      - name: Install KubeVirt operator + CR (emulation mode)
        run: |
          KUBEVIRT_VERSION=$(curl -fsSL https://api.github.com/repos/kubevirt/kubevirt/releases/latest | jq -r .tag_name)
          echo "Installing KubeVirt ${KUBEVIRT_VERSION}"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt patch kubevirt kubevirt --type=merge \
            -p '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
          kubectl -n kubevirt wait --for=condition=Available kv/kubevirt --timeout=10m

      - name: Create molecule namespace
        run: kubectl create namespace molecule

      - name: Watch VM/VMI state in background
        run: |
          (while true; do
             echo "=== $(date -u +%H:%M:%S) ==="
             kubectl -n molecule get vm,vmi,pod,svc -o wide 2>/dev/null || true
             sleep 15
           done) > /tmp/vm-watch.log 2>&1 &
          echo "$!" > /tmp/vm-watch.pid

      - name: Run kubevirt scenario
        working-directory: ansible_collections/david_igou/molecule_provisioners
        env:
          PROVISIONER: kubevirt
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          # Override pyproject.toml addopts to disable xdist (-n 2) which captures
          # all molecule output. We need molecule's PLAY RECAP visible in CI logs
          # to confirm the scenario actually exercised create/prepare/converge/verify.
          pytest tests/integration -v -k default -s -o addopts=""

      - name: Stop VM watcher and dump trace
        if: always()
        run: |
          if [[ -f /tmp/vm-watch.pid ]]; then
            kill "$(cat /tmp/vm-watch.pid)" 2>/dev/null || true
          fi
          echo "::group::VM/VMI watch trace"
          cat /tmp/vm-watch.log 2>/dev/null || echo "(no trace)"
          echo "::endgroup::"

      - name: Assert a VirtualMachine existed during the run
        run: |
          # Fail loudly if our watch trace never observed a VirtualMachine — that
          # would mean molecule passed without actually exercising kubevirt.
          if ! grep -qE "VirtualMachine|virtualmachine\.kubevirt\.io" /tmp/vm-watch.log; then
            echo "::error::No VirtualMachine ever appeared in the molecule namespace — scenario was a no-op."
            exit 1
          fi

      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n kubevirt describe kv kubevirt
          kubectl -n molecule describe vm,vmi,pod,svc 2>/dev/null || true
          kubectl -n molecule logs -l kubevirt.io=virt-launcher --tail=200 2>/dev/null || true
  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - unit-galaxy
      - unit-source
      - ansible-lint
      - integration-podman
      - integration-kubevirt
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.unit-galaxy.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.unit-source.result }}',
          '${{ needs.integration-podman.result }}',
          '${{ needs.integration-kubevirt.result }}'
          ])"
