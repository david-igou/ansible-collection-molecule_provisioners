---
DOCUMENTATION:
  name: qemu_size
  author:
    - David Igou (@david-igou)
  version_added: 0.0.7
  short_description: Convert an absolute QEMU disk size to bytes
  description:
    - Internal configuration helper for the QEMU role.
  options:
    _input:
      description: Role-provided input; use the documented QEMU lifecycle rather than calling internal
        filters directly.
      type: str
      required: true
EXAMPLES: |
  - name: Transform role configuration
    ansible.builtin.set_fact:
      __bytes: "{{ '2G' | david_igou.molecule_provisioners.qemu_size }}"
RETURN:
  _value:
    description: Convert an absolute QEMU disk size to bytes.
    type: int
