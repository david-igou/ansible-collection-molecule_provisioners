---
DOCUMENTATION:
  name: qemu_valid
  author:
    - David Igou (@david-igou)
  version_added: 0.0.7
  short_description: Validate merged QEMU host specifications
  description:
    - Internal configuration helper for the QEMU role.
  options:
    _input:
      description: Role-provided input; use the documented QEMU lifecycle rather than calling internal
        filters directly.
      type: dict
      required: true
EXAMPLES: |
  - name: Transform role configuration
    ansible.builtin.set_fact:
      __valid: "{{ merged_hosts | david_igou.molecule_provisioners.qemu_valid }}"
RETURN:
  _value:
    description: Validate merged QEMU host specifications.
    type: bool
