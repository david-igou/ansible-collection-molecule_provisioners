---
minor_changes:
  - >-
    kubevirt role: ``ssh_service.type`` now accepts ``None`` to skip Service
    creation entirely. ``connection_ip`` is required in this mode (validated
    on create). ``ansible_port`` defaults to 22 and can be overridden via
    ``ssh_service.port``. Unblocks setups where SSH access is provided by an
    external Route/Ingress, or where the controller can talk to pod IPs
    directly. ``NodePort`` remains the default; ``LoadBalancer`` /
    ``ClusterIP``+port-forward remain out of scope (#31).
