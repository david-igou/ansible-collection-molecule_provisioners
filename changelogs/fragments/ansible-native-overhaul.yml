---
major_changes:
  - >-
    Lifecycle plays now target the molecule hosts and run every task on the
    controller, so each host reads its own mp, mp_defaults and role variables
    straight from inventory. Hosts are provisioned in parallel through forks.
  - >-
    The qemu, kubevirt and vmware backends are rewritten with ansible-core and
    collection modules only. The collection no longer ships Python plugins.
breaking_changes:
  - >-
    podman and docker - mp.podman and mp.docker are now passed unchanged to
    containers.podman.podman_container and community.docker.docker_container,
    so keys use those modules' option names (for example network, volume and
    security_opt instead of podman_network, volumes and security_opts).
    Networks move to the mp_podman_networks and mp_docker_networks lists of
    module arguments. The default command is now sleep infinity.
  - >-
    podman and docker - the role defaults dicts are renamed to
    mp_podman_instance_defaults and mp_docker_instance_defaults, and prepare
    no longer installs sudo.
  - >-
    A host no longer needs an mp.<backend> block when mp_defaults.<backend>
    supplies its settings.
removed_features:
  - >-
    The aws backend and its plugins are removed. No consumer used it; it can
    return as a native rewrite.
  - >-
    vmware - the run journal, lock, Tools/vm_shell bootstrap and Windows
    guests are removed. VMs are named after the host and run id, carry an
    ownership annotation, and bootstrap through GuestInfo cloud-init.
  - The reset playbook is removed.
  - >-
    The pytest unit and integration suites are replaced by Molecule scenarios
    under extensions/molecule.
