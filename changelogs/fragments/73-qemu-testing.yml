---
breaking_changes:
  - >-
    qemu - enabled automatic management-port allocation by default and required persisted VM ownership for cleanup.
    Destroy legacy guests with their original provisioner before upgrading; identity and host-forward overrides
    in extra_args are now reserved (https://github.com/david-igou/ansible-collection-molecule_provisioners/pull/74).
minor_changes:
  - >-
    qemu - added managed data disks, configurable NoCloud bootstrap, isolated socket links, structured extra NICs,
    TCP/UDP service forwards, network_cli access and private boot diagnostics.
bugfixes:
  - >-
    qemu - preserved per-guest UEFI variables and bootstrap media on repeated create, rejected implicit image-backed
    disk shrink and verified PID start time plus QMP UUID before signaling guests.
