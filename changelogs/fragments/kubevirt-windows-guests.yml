---
minor_changes:
  - kubevirt - support Windows guests on the kubevirt backend via a new per-host
    ``connection`` discriminator (``ssh`` (default) ``| psrp | winrm``). Windows Server 2025
    / Windows 11 test VMs are provisioned from sysprep-generalized golden-image DataSources
    and specialized at first boot by a KubeVirt sysprep volume, then reached over
    WinRM-over-HTTPS (NTLM, 5986, certificate validation off).
  - kubevirt - add per-host ``admin_user`` (default ``Administrator``) and ``admin_password``
    (required, sensitive/``no_log``) fields, consumed by the ``psrp``/``winrm`` runtime
    inventory as ``ansible_user``/``ansible_password``. ``admin_password`` is validated
    fail-fast when missing.
  - kubevirt - add an optional per-host ``sysprep_secret`` field. When set, the renderer
    attaches a ``cdrom`` disk plus a sysprep volume whose ``sysprep.secret.name`` references
    the named Secret (note the ``secret.name`` field - ``secretName`` is silently dropped by
    the KubeVirt API). Valid for any connection type.
  - kubevirt - when ``connection`` is ``psrp``/``winrm`` the renderer omits the
    ``cloudinitdisk`` disk/volume (Windows goldens have no cloud-init), the per-VM NodePort
    Service (still keyed ``ssh_service`` for backward compatibility) targets guest port 5986,
    and SSH keypair generation is skipped entirely when no host uses an ssh connection.
  - kubevirt - add ``mp_kubevirt_windows_wait_timeout`` (default 900s) used by the
    ``prepare`` phase for ``psrp``/``winrm`` hosts, since OOBE specialize and the unattend
    FirstLogonCommands can take several minutes. ``ssh`` hosts continue to use
    ``mp_kubevirt_wait_timeout`` (120s).
  - kubevirt - add ``mp_kubevirt_allowed_connections`` (default ``[ssh, psrp, winrm]``) as
    the allowlist for the new ``connection`` field.
