---
argument_specs:
  create:
    short_description: Provision disposable VMware guests with saved ownership.
    options:
      mp_vmware_provision_timeout: &id001
        type: int
        default: 7200
        description: Per-guest provision timeout in seconds.
      mp_vmware_tools_timeout: &id002
        type: int
        default: 600
        description: Per-guest tools timeout in seconds.
      mp_vmware_wait_timeout: &id003
        type: int
        default: 600
        description: Per-guest wait timeout in seconds.
      mp_vmware_windows_wait_timeout: &id004
        type: int
        default: 900
        description: Per-guest windows wait timeout in seconds.
      mp_vmware_cleanup_timeout: &id005
        type: int
        default: 7200
        description: Per-guest cleanup timeout in seconds.
      mp_vmware_concurrency: &id006
        type: int
        default: 4
        description: Maximum simultaneous per-host operations.
      mp_vmware_role_defaults: &id007
        type: dict
        default: {}
        description: Base VMware host settings overridden by shared defaults and per-host settings.
  prepare:
    short_description: Authenticate disposable VMware guests with saved ownership.
    options:
      mp_vmware_provision_timeout: *id001
      mp_vmware_tools_timeout: *id002
      mp_vmware_wait_timeout: *id003
      mp_vmware_windows_wait_timeout: *id004
      mp_vmware_cleanup_timeout: *id005
      mp_vmware_concurrency: *id006
      mp_vmware_role_defaults: *id007
  destroy:
    short_description: Remove disposable VMware guests with saved ownership.
    options:
      mp_vmware_provision_timeout: *id001
      mp_vmware_tools_timeout: *id002
      mp_vmware_wait_timeout: *id003
      mp_vmware_windows_wait_timeout: *id004
      mp_vmware_cleanup_timeout: *id005
      mp_vmware_concurrency: *id006
      mp_vmware_role_defaults: *id007
