---
- name: Wait for the guest to accept connections
  ansible.builtin.wait_for_connection:
    timeout: "{{ mp_vmware_wait_timeout }}"

- name: Wait for cloud-init to finish
  ansible.builtin.raw: cloud-init status --wait
  register: _mp_cloud_init_status
  changed_when: false
  failed_when: _mp_cloud_init_status.rc not in [0, 2] # 2: finished with warnings
  when: _mp_guestinfo
