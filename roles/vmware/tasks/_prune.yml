---
- name: prune | Locate the private connection overlay
  ansible.builtin.stat:
    path: "{{ molecule_ephemeral_directory }}/inventory/molecule_runtime.yml"
  register: __mp_vmware_overlay_file
- name: prune | Retain connection entries only for remaining resources
  vars:
    __mp_vmware_old_overlay: >-
      {{ lookup('ansible.builtin.file', molecule_ephemeral_directory ~ '/inventory/molecule_runtime.yml') | from_yaml }}
    __mp_vmware_pruned:
      all:
        hosts: >-
          {{ __mp_vmware_old_overlay.all.hosts | dict2items |
          selectattr('key', 'in', __mp_vmware_run.hosts.keys() | list) | items2dict }}
  ansible.builtin.copy:
    dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_runtime.yml"
    content: "{{ __mp_vmware_pruned | to_nice_yaml }}"
    mode: "0600"
  no_log: true
  diff: false
  when: __mp_vmware_overlay_file.stat.exists
