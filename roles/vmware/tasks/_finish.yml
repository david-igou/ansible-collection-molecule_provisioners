---
- name: finish | Finish each host without abandoning other workers
  block:
    - name: finish | Complete clone and bootstrap
      ansible.builtin.include_tasks: _finish_host.yml
  rescue:
    - name: finish | Retain this host for retry and report a sanitized failure
      ansible.builtin.set_fact:
        __mp_vmware_failed_hosts: "{{ __mp_vmware_failed_hosts + [__mp_vmware_host] }}"
