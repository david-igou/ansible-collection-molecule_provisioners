---
- name: keys | Initialize public key material
  ansible.builtin.set_fact:
    __mp_vmware_public_keys: {}
- name: keys | Generate the shared scenario key when needed
  community.crypto.openssh_keypair:
    path: "{{ molecule_ephemeral_directory }}/identity_file"
    type: ed25519
    mode: "0600"
  when: __mp_vmware_run.generated_key
- name: keys | Prepare each Linux management key
  ansible.builtin.include_tasks: _key.yml
  loop: '{{ groups["molecule"] }}'
  loop_control:
    loop_var: __mp_vmware_key_host
  when: __mp_vmware_specs[__mp_vmware_key_host].instance_os_type == 'linux'
