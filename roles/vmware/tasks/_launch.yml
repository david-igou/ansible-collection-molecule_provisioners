---
- name: VMware | Reject a missing previously created guest
  ansible.builtin.assert:
    that: >-
      __mp_vmware_run.hosts[__mp_vmware_host].phase == 'planned' or
      __mp_vmware_run.hosts[__mp_vmware_host].job_id is defined or
      __mp_vmware_inspection.observations[__mp_vmware_host].exists
    fail_msg: A saved guest disappeared; destroy saved state before creating a replacement.
- name: VMware | Refuse an uncheckpointed submission
  ansible.builtin.assert:
    that: >-
      __mp_vmware_run.hosts[__mp_vmware_host].phase != 'submitting' and
      not (__mp_vmware_run.hosts[__mp_vmware_host].phase == 'planned' and
      __mp_vmware_inspection.observations[__mp_vmware_host].exists)
    fail_msg: Clone submission outcome is uncertain; retain state for operator recovery.
- name: VMware | Record submission intent before starting a worker
  ansible.builtin.set_fact:
    __mp_vmware_run: >-
      {{ __mp_vmware_run | david_igou.molecule_provisioners.vmware_update_host(__mp_vmware_host, {'phase':
      'submitting'})
      }}
  when: __mp_vmware_run.hosts[__mp_vmware_host].phase == 'planned'
- name: VMware | Checkpoint submission intent
  ansible.builtin.include_tasks: _save.yml
- name: VMware | Launch one clone using the pinned intent
  community.vmware.vmware_guest: >-
    {{ __mp_vmware_specs[__mp_vmware_host] |
    david_igou.molecule_provisioners.vmware_request(__mp_vmware_run.hosts[__mp_vmware_host],
    __mp_vmware_public_keys[__mp_vmware_host] | default("")) |
    combine({'wait_for_ip_address_timeout': mp_vmware_provision_timeout,
    'wait_for_customization_timeout': mp_vmware_provision_timeout}) }}
  async: "{{ mp_vmware_provision_timeout }}"
  poll: 0
  register: __mp_vmware_launch
  no_log: true
  when:
    - __mp_vmware_run.hosts[__mp_vmware_host].phase == 'submitting'
    - __mp_vmware_run.hosts[__mp_vmware_host].job_id is not defined
    - not __mp_vmware_inspection.observations[__mp_vmware_host].exists
- name: VMware | Save the worker identity immediately
  ansible.builtin.set_fact:
    __mp_vmware_run: >-
      {{ __mp_vmware_run | david_igou.molecule_provisioners.vmware_update_host(__mp_vmware_host, {'job_id':
      __mp_vmware_launch.ansible_job_id,
      'phase': 'submitted'}) }}
  when: __mp_vmware_launch.ansible_job_id is defined
- name: VMware | Checkpoint the worker
  ansible.builtin.include_tasks: _save.yml
