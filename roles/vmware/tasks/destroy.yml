---
- name: Delete the VM
  module_defaults:
    group/community.vmware.vmware: "{{ mp_vmware_connection }}"
  block:
    - name: Look up the VM
      community.vmware.vmware_guest_info:
        datacenter: "{{ _mp_spec.datacenter }}"
        folder: "{{ _mp_spec.folder }}"
        name: "{{ _mp_name }}"
      register: _mp_vm
      failed_when:
        - _mp_vm is failed
        - "'non-existing VM' not in _mp_vm.msg | default('')"

    - name: Check that the VM belongs to this run
      ansible.builtin.assert:
        that: _mp_vm.instance.annotation == _mp_annotation
        fail_msg: >-
          {{ _mp_name }} in {{ _mp_spec.folder }} lacks this run's annotation; not deleting it.
        quiet: true
      when: _mp_vm.instance is defined

    - name: Power off and delete the VM
      community.vmware.vmware_guest:
        datacenter: "{{ _mp_spec.datacenter }}"
        uuid: "{{ _mp_vm.instance.instance_uuid }}"
        use_instance_uuid: true
        state: absent
        force: true
      when: _mp_vm.instance is defined
