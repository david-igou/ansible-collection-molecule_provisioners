---
- name: destroy | Acquire the controller lease
  david_igou.molecule_provisioners.vmware_lock:
    directory: "{{ molecule_ephemeral_directory }}"
    state: held
- name: destroy | Execute the destroy lifecycle
  vars:
    ansible_async_dir: "{{ molecule_ephemeral_directory }}/.vmware-async"
  block:
    - name: destroy | Run scoped lifecycle tasks
      ansible.builtin.include_tasks: _destroy.yml
  always:
    - name: destroy | Release the controller lease
      david_igou.molecule_provisioners.vmware_lock:
        directory: "{{ molecule_ephemeral_directory }}"
        state: released
