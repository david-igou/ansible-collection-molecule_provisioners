---
argument_specs:
  main:
    short_description: Podman containers as Molecule instances
    description:
      - Not called directly. Scenarios import the collection's C(create),
        C(prepare) and C(destroy) playbooks, which include this role's entry
        point of the same name when C(mp_backend) is C(podman).
    options: {}
  create:
    short_description: Start one Podman container per molecule host
    description:
      - Each host's container is C(mp_podman_instance_defaults), then
        C(mp_defaults.podman), then the host's C(mp.podman), merged in that
        order and passed to M(containers.podman.podman_container). Any option
        of that module can be set; the container name is the inventory hostname.
    options:
      mp_podman_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.podman and mp.podman.
      mp_podman_networks:
        type: list
        elements: dict
        default: []
        description: M(containers.podman.podman_network) arguments, one dict per network.
      mp_podman_executable:
        type: str
        default: podman
        description: Podman binary. Defaults to C(MOLECULE_PODMAN_EXECUTABLE) when set.
  destroy:
    short_description: Remove the containers and networks
    description:
      - Removes each host's container, then the networks in C(mp_podman_networks).
        Succeeds when nothing exists.
    options:
      mp_podman_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.podman and mp.podman.
      mp_podman_networks:
        type: list
        elements: dict
        default: []
        description: M(containers.podman.podman_network) arguments, one dict per network.
      mp_podman_executable:
        type: str
        default: podman
        description: Podman binary. Defaults to C(MOLECULE_PODMAN_EXECUTABLE) when set.
  prepare:
    short_description: Wait until each container can run Ansible modules
    description:
      - Runs an Ansible module in each container, which catches images
        without Python before converge.
    options: {}
