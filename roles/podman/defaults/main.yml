---
# Settings every container starts from. mp_defaults.podman and then each
# host's mp.podman are merged over this dict and passed to
# containers.podman.podman_container.
mp_podman_instance_defaults:
  command: sleep infinity

# Arguments for containers.podman.podman_network, one dict per network.
# Created before the containers and removed after them.
mp_podman_networks: []

mp_podman_executable: "{{ lookup('ansible.builtin.env', 'MOLECULE_PODMAN_EXECUTABLE') | default('podman', true) }}"
