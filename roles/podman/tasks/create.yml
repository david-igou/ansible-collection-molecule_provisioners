---
- name: Create the networks
  containers.podman.podman_network:
    name: "{{ item.name }}"
    executable: "{{ mp_podman_executable }}"
  module_defaults:
    containers.podman.podman_network: "{{ item }}"
  loop: "{{ mp_podman_networks }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true

- name: Start the container
  containers.podman.podman_container:
    name: "{{ inventory_hostname }}"
    executable: "{{ mp_podman_executable }}"
    state: started
  module_defaults:
    containers.podman.podman_container: "{{ _mp_spec }}"

- name: Give a failing container command time to exit
  ansible.builtin.pause:
    seconds: 2

- name: Read the container state
  containers.podman.podman_container_info:
    name: "{{ inventory_hostname }}"
    executable: "{{ mp_podman_executable }}"
  register: _mp_podman_info
  no_log: true # the container environment may hold secrets

- name: Check that the container is still running
  vars:
    _mp_state: "{{ _mp_podman_info.containers[0].State }}"
  ansible.builtin.assert:
    that: _mp_state.Running
    fail_msg: >-
      Container {{ inventory_hostname }} exited with code {{ _mp_state.ExitCode }}.
      Run `{{ mp_podman_executable }} logs {{ inventory_hostname }}` to see why;
      the image may need a different command.
    quiet: true

- name: Record the connection settings
  ansible.builtin.set_fact:
    mp_runtime:
      ansible_connection: containers.podman.podman
      ansible_podman_executable: "{{ mp_podman_executable }}"
      ansible_user: "{{ ansible_user | default('root') }}"
