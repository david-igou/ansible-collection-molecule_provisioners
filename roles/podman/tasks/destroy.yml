---
- name: Remove the container
  containers.podman.podman_container:
    name: "{{ inventory_hostname }}"
    executable: "{{ mp_podman_executable }}"
    state: absent

- name: Remove the networks
  containers.podman.podman_network:
    name: "{{ item.name }}"
    executable: "{{ mp_podman_executable }}"
    state: absent
  loop: "{{ mp_podman_networks }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true
