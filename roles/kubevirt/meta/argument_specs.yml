---
argument_specs:
  create:
    short_description: Create one KubeVirt VirtualMachine per molecule host
    description:
      - Each host's settings are C(mp_kubevirt_instance_defaults), then
        C(mp_defaults.kubevirt), then the host's C(mp.kubevirt), merged
        recursively in that order and validated against the C(instance) entry point.
      - Resources are named C(<inventory_hostname>-<mp_run_id>) and labelled with
        the run id, so parallel runs never collide.
    options:
      mp_kubevirt_instance_defaults:
        type: dict
        description: Instance settings applied before mp_defaults.kubevirt and mp.kubevirt.
      mp_kubevirt_wait_timeout:
        type: int
        default: 600
        description:
          - Seconds to wait for the VM to become Ready (including disk imports) and for its pod IP.
  destroy:
    short_description: Delete the VirtualMachines, Services and cloud-init Secrets of this run
    options:
      mp_kubevirt_instance_defaults:
        type: dict
        description: Instance settings applied before mp_defaults.kubevirt and mp.kubevirt.
      mp_kubevirt_wait_timeout:
        type: int
        default: 600
        description: Seconds to wait for the resources to disappear.
  prepare:
    short_description: Wait until each guest accepts connections and cloud-init has finished
    options:
      mp_kubevirt_wait_timeout:
        type: int
        default: 600
        description: Seconds to wait for an SSH guest.
      mp_kubevirt_windows_wait_timeout:
        type: int
        default: 900
        description: Seconds to wait for a psrp or winrm guest.
  instance:
    short_description: Per-host settings (mp.kubevirt), validated by create
    description:
      - Not a task entry point. Documents the merged C(mp.kubevirt) settings of
        one host. Unknown keys fail validation.
    options:
      kubevirt:
        type: dict
        required: true
        description: The merged settings of one host.
        mutually_exclusive:
          - - instancetype
            - cpu
          - - instancetype
            - memory
        options:
          boot_source:
            type: dict
            required: true
            description: Where the boot disk comes from.
            required_if:
              - - type
                - container_disk
                - - image
              - - type
                - pvc
                - - name
              - - type
                - data_volume
                - - size
              - - type
                - data_volume
                - - source
                  - source_ref
                - true
            mutually_exclusive:
              - - source
                - source_ref
            options:
              type:
                type: str
                required: true
                choices:
                  - container_disk
                  - data_volume
                  - pvc
                description:
                  - C(container_disk) boots an ephemeral copy of a container image.
                  - C(data_volume) imports a disk with CDI, deleted with the VM.
                  - C(pvc) boots an existing PersistentVolumeClaim in place.
              image:
                type: str
                description: Container disk image (container_disk).
              name:
                type: str
                description: Existing PVC name (pvc).
              source:
                type: dict
                description: >-
                  Raw CDI DataVolume source (data_volume), for example
                  C({http: {url: ...}}), C({registry: {url: ...}}) or C({pvc: {name: ..., namespace: ...}}).
              source_ref:
                type: dict
                description: CDI DataSource reference (data_volume). C(kind) defaults to DataSource.
                options:
                  name:
                    type: str
                    required: true
                    description: DataSource name.
                  namespace:
                    type: str
                    description: DataSource namespace.
                  kind:
                    type: str
                    description: Reference kind.
              size:
                type: str
                description: Requested size of the imported disk, such as C(20Gi) (data_volume).
              storage_class:
                type: str
                description: Storage class; the cluster default when omitted.
              volume_mode:
                type: str
                choices:
                  - Filesystem
                  - Block
                description: Volume mode; CDI's StorageProfile decides when omitted.
              access_modes:
                type: list
                elements: str
                description: Access modes; CDI's StorageProfile decides when omitted.
          namespace:
            type: str
            description: Namespace for every resource of the host. Defaults to C(molecule).
          ssh_user:
            type: str
            description: Management user created by cloud-init with the generated SSH key. Defaults to C(cloud-user).
          cpu:
            type: dict
            description: Guest CPU topology. Excludes instancetype.
            options:
              cores:
                type: int
                description: Cores per socket.
              sockets:
                type: int
                description: Sockets.
              threads:
                type: int
                description: Threads per core.
              model:
                type: str
                description: CPU model, such as C(host-passthrough).
          memory:
            type: str
            description: Requested guest memory, such as C(2Gi). Defaults to C(1Gi) when no instancetype is set.
          instancetype:
            type: str
            description: VirtualMachineClusterInstancetype name. Excludes cpu and memory.
          preference:
            type: str
            description: VirtualMachineClusterPreference name.
          node_selector:
            type: dict
            description: Pod node selector.
          tolerations:
            type: list
            elements: dict
            description: Pod tolerations.
          affinity:
            type: dict
            description: Pod affinity.
          cloud_init:
            type: dict
            description: NoCloud data, stored in a Secret.
            options:
              enabled:
                type: bool
                description: Attach cloud-init data. Defaults to true for ssh guests and false for psrp/winrm.
              user_data:
                type: dict
                description: >-
                  Cloud-config mapping. For ssh guests the management user and its key are
                  merged into C(users) by name.
              network_data:
                type: dict
                description: Cloud-init network-config mapping.
          interfaces:
            type: list
            elements: dict
            description: KubeVirt interfaces. Replace the default masquerade interface named C(default).
          networks:
            type: list
            elements: dict
            description: KubeVirt networks paired with interfaces by name. Replace the default pod network.
          boot_disk:
            type: dict
            description: Boot disk device settings.
            options:
              bus:
                type: str
                choices:
                  - virtio
                  - sata
                  - scsi
                description: Disk bus; the preference or KubeVirt decides when omitted.
              boot_order:
                type: int
                description: KubeVirt bootOrder.
          data_disks:
            type: list
            elements: dict
            description: Extra disks created as DataVolumes (blank unless a source is given).
            mutually_exclusive:
              - - source
                - source_ref
            options:
              name:
                type: str
                required: true
                description: Disk and volume name.
              size:
                type: str
                required: true
                description: Size, such as C(10Gi).
              source:
                type: dict
                description: Raw CDI source. Defaults to a blank disk.
              source_ref:
                type: dict
                description: CDI DataSource reference.
              storage_class:
                type: str
                description: Storage class; the cluster default when omitted.
              volume_mode:
                type: str
                choices:
                  - Filesystem
                  - Block
                description: Volume mode.
              access_modes:
                type: list
                elements: str
                description: Access modes.
              bus:
                type: str
                choices:
                  - virtio
                  - sata
                  - scsi
                description: Disk bus.
              boot_order:
                type: int
                description: KubeVirt bootOrder.
          connection:
            type: str
            choices:
              - ssh
              - psrp
              - winrm
            description: >-
              Ansible connection for converge and verify. psrp and winrm use
              HTTPS with NTLM. Defaults to C(ssh).
          connection_vars:
            type: dict
            description: >-
              Host vars merged over the generated connection settings, for example
              C(ansible_user) and C(ansible_password) for Windows guests.
          connection_ip:
            type: str
            description: Address the controller connects to. Required with ssh_service type None.
          ssh_service:
            type: dict
            description: How the controller reaches the management port.
            options:
              type:
                type: str
                choices:
                  - NodePort
                  - PodIP
                  - None
                description:
                  - C(NodePort) creates a Service and connects to a Ready node's InternalIP (or connection_ip).
                  - C(PodIP) connects to the VMI pod network address; for controllers inside the cluster.
                  - C(None) creates no Service and connects to connection_ip.
              port:
                type: int
                description: Guest management port. Defaults to 22, or 5986 for psrp/winrm.
          application_ports:
            type: list
            elements: dict
            description: Extra guest ports, published to converge and verify as C(mp_kubevirt_endpoints).
            options:
              name:
                type: str
                required: true
                description: Port name (at most 15 characters, not C(management)).
              port:
                type: int
                required: true
                description: Service port, and guest port unless target_port is set.
              target_port:
                type: int
                description: Guest port.
              protocol:
                type: str
                choices:
                  - TCP
                  - UDP
                description: Protocol. Defaults to TCP.
          sysprep_secret:
            type: str
            description: Existing Secret with C(unattend.xml) attached as a sysprep CD-ROM (Windows).
          vm_overrides:
            type: dict
            description: >-
              Merged recursively over the rendered VirtualMachine. Lists append,
              so extra disks, volumes, interfaces and networks go here.
