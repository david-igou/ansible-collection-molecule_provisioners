---
argument_specs:
  main:
    short_description: >-
      Default entry point — does nothing on its own; use tasks_from=create|destroy|prepare.
    options: {}
  create:
    short_description: >-
      Create KubeVirt VirtualMachines and NodePort services for hosts in groups['molecule'].
    options:
      mp_kubevirt_run_isolation:
        type: bool
        default: true
        description: Persist run-scoped names in the Molecule ephemeral directory; set false for fixed names.
      mp_kubevirt_cleanup_timeout:
        type: int
        default: 120
        description: Seconds to wait for isolated resources to disappear during destroy.
      mp_kubevirt_role_defaults:
        type: dict
        description: >-
          Per-host field defaults. Currently includes namespace, ssh_user, memory,
          connection (default ssh), and ssh_service.type. Layered as: this dict <- mp_defaults.kubevirt
          <- hostvars[item].mp.kubevirt. Per-host hostvars accepts a much wider
          schema (boot_source, cpu, memory_limit, scheduling, extras, vm_overrides,
          cloud_init, interfaces, networks, vm_definition, boot_disk, data_disks,
          connection_vars, application_ports); see roles/kubevirt/README.md.
      mp_kubevirt_ssh_key_path:
        type: path
        description: >-
          SSH private key path; generated for simple-variable guests and supplied
          by the caller for full definitions. Defaults to molecule_ephemeral_directory/identity_file.
      mp_kubevirt_allowed_ssh_service_types:
        type: list
        elements: str
        description: Allowlist for ssh_service.type. Supports NodePort, None, and PodIP.
      mp_kubevirt_podip_lookup_retries:
        type: int
        description: PodIP mode — retries for the VMI pod-IP lookup (default 60).
      mp_kubevirt_podip_lookup_delay:
        type: int
        description: PodIP mode — delay in seconds between VMI pod-IP lookups (default 5).
      mp_kubevirt_allowed_connections:
        type: list
        elements: str
        description: >-
          Allowlist for the per-host mp.kubevirt.connection discriminator.
          Defaults to [ssh, psrp, winrm]. ssh injects an SSH key via cloud-init;
          psrp/winrm drive Windows guests over WinRM-over-HTTPS (5986, NTLM,
          cert validation off) and require admin_password (and typically a
          sysprep_secret) in the per-host spec.
  destroy:
    short_description: Delete KubeVirt VirtualMachines and NodePort services.
    options:
      mp_kubevirt_run_isolation:
        type: bool
        default: true
        description: Persist run-scoped names in the Molecule ephemeral directory; set false for fixed names.
      mp_kubevirt_cleanup_timeout:
        type: int
        default: 120
        description: Seconds to wait for isolated resources to disappear during destroy.
      mp_kubevirt_role_defaults:
        type: dict
  prepare:
    short_description: Wait for KubeVirt-provisioned hosts to be reachable.
    options:
      mp_kubevirt_wait_timeout:
        type: int
        default: 120
        description: wait_for_connection timeout (seconds) for ssh/Linux hosts.
      mp_kubevirt_windows_wait_timeout:
        type: int
        default: 900
        description: >-
          wait_for_connection timeout (seconds) for Windows (psrp/winrm) hosts.
          Generous by default to cover OOBE specialize + FirstLogonCommands.
  definition:
    short_description: Validate a full per-host VirtualMachine definition.
    options:
      vm_definition:
        type: dict
        required: true
        no_log: true
        description: >-
          Desired-state kubevirt.io/v1 VirtualMachine manifest replacing generated
          VM configuration. Mutually exclusive with simple VM parameters and
          vm_overrides. Identity remains managed by the provisioner.
  customization:
    short_description: Validate per-host cloud-init and network configuration before provisioning.
    options:
      cloud_init:
        type: dict
        default: {}
        description: Guest bootstrap configuration; NoCloud is enabled by default for SSH guests.
        options:
          enabled:
            type: bool
            description: Attach cloud-init media; defaults to true for SSH and false for PSRP/WinRM.
          inject_ssh_key:
            type: bool
            description: Merge generated SSH access into user data; defaults to true for SSH guests.
          user_data:
            type: dict
            no_log: true
            description: Cloud-config mapping; mutually exclusive with user_data_secret.
          user_data_secret:
            type: str
            description: Existing same-namespace Secret containing userdata; requires inject_ssh_key false.
          network_data:
            type: dict
            no_log: true
            description: Cloud-init network-config mapping; mutually exclusive with network_data_secret.
          network_data_secret:
            type: str
            description: Existing same-namespace Secret containing networkdata.
      interfaces:
        type: list
        elements: dict
        description: KubeVirt interfaces replacing the default masquerade interface; extras still append.
      networks:
        type: list
        elements: dict
        description: KubeVirt networks replacing the default pod network; extras still append.
  access:
    short_description: Validate per-host management and application access.
    options:
      connection_vars:
        type: dict
        no_log: true
        description: Ansible connection options merged over defaults; endpoint and plugin fields are protected.
      ssh_service:
        type: dict
        description: Management access mode and guest listener port.
        options:
          type:
            type: str
            description: Management endpoint mode; defaults to NodePort.
            choices:
              - NodePort
              - "None"
              - PodIP
          port:
            type: int
            description: In-guest management port in every access mode; defaults to 22 or 5986.
      application_ports:
        type: list
        elements: dict
        description: Application ports on the management Service, with direct endpoints in None/PodIP mode.
        options:
          name:
            type: str
            required: true
            description: Unique Service port name, at most 15 characters; management is reserved.
          port:
            type: int
            required: true
            description: Service port; also the guest port unless target_port is set.
          target_port:
            type: int
            description: In-guest application port.
          protocol:
            type: str
            description: Transport protocol; defaults to TCP.
            choices:
              - TCP
              - UDP
  storage:
    short_description: Validate generated boot and data disks.
    options:
      boot_storage:
        type: dict
        description: Storage mode options read from the generated boot_source.
        options:
          volume_mode:
            type: str
            description: PVC volume mode; CDI uses its StorageProfile when omitted.
            choices:
              - Filesystem
              - Block
          access_modes:
            type: list
            elements: str
            description: PVC access modes; CDI uses its StorageProfile when omitted.
            choices:
              - ReadWriteOnce
              - ReadWriteMany
              - ReadOnlyMany
              - ReadWriteOncePod
      boot_disk:
        type: dict
        description: Bus and optional boot order for the generated boot disk.
        options:
          bus:
            type: str
            description: Boot-disk bus; defaults to virtio.
            choices:
              - virtio
              - sata
              - scsi
          boot_order:
            type: int
            description: Positive unique KubeVirt bootOrder; omitted by default.
      data_disks:
        type: list
        elements: dict
        description: Managed persistent disks backed by generated CDI DataVolume templates.
        options:
          name:
            type: str
            required: true
            description: Unique guest disk/volume name; generated resource names remain managed.
          size:
            type: str
            required: true
            description: Requested storage quantity, such as 10Gi.
          source:
            type: dict
            description: Raw CDI source mapping; defaults to a blank image when neither source nor source_ref is set.
          source_ref:
            type: dict
            description: DataSource reference; mutually exclusive with source.
            options:
              name:
                type: str
                required: true
                description: Existing DataSource name.
              namespace:
                type: str
                required: true
                description: Existing DataSource namespace; cross-namespace grants are caller-owned.
              kind:
                type: str
                description: Reference kind; defaults to DataSource.
                choices:
                  - DataSource
          storage_class:
            type: str
            description: Storage class; omitted for CDI defaults, or empty for no class.
          volume_mode:
            type: str
            description: PVC volume mode; defaults come from CDI's StorageProfile.
            choices:
              - Filesystem
              - Block
          access_modes:
            type: list
            elements: str
            description: PVC access modes; defaults come from CDI's StorageProfile.
            choices:
              - ReadWriteOnce
              - ReadWriteMany
              - ReadOnlyMany
              - ReadWriteOncePod
          bus:
            type: str
            description: Guest disk bus; defaults to virtio.
            choices:
              - virtio
              - sata
              - scsi
          boot_order:
            type: int
            description: Positive unique KubeVirt bootOrder; omitted by default.
