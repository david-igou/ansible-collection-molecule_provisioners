---
# Recompute namespace per host for delete (we don't trust ephemeral state to
# survive across phases; mp_defaults provides the namespace if not per-host).
- name: Resolve per-host kubevirt configuration
  ansible.builtin.include_tasks: _spec_merge.yml

- name: Delete VirtualMachine in KubeVirt
  kubernetes.core.k8s:
    state: absent
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    name: "{{ item }}"
    namespace: "{{ _mp_specs[item].namespace }}"
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# Only NodePort mode created a Service. Guarding the delete keeps scoped
# service accounts without `services` RBAC (None/PodIP consumers) working.
- name: Delete NodePort SSH service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ item }}"
    namespace: "{{ _mp_specs[item].namespace }}"
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'NodePort'
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"
