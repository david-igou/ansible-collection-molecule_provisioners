---
- name: Resolve per-host kubevirt configuration
  ansible.builtin.include_tasks: _spec_merge.yml

- name: Validate per-host specs
  ansible.builtin.include_tasks: _validate.yml
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

- name: Load any saved run identity
  ansible.builtin.include_tasks: _load_run.yml

- name: Initialize or resume run isolation
  ansible.builtin.include_tasks: _init_run.yml

- name: Check isolated resources before provisioning
  ansible.builtin.include_tasks: _check_run_host.yml
  loop: "{{ __mp_kubevirt_run.hosts | dict2items }}"
  loop_control:
    loop_var: run_host
    label: "{{ run_host.key }}"
  when: mp_kubevirt_run_isolation | bool

# SSH connections use this key even when cloud-init injection is disabled.
# Explicit injection also needs a key; ordinary all-Windows scenarios skip it.
- name: Check the caller's SSH key for full definitions
  ansible.builtin.stat:
    path: "{{ mp_kubevirt_ssh_key_path }}"
  register: __mp_kubevirt_full_definition_key
  when: >-
    _mp_specs.values() | selectattr('vm_definition', 'defined')
    | selectattr('connection', 'equalto', 'ssh') | list | length > 0

- name: Require an existing SSH key for full definitions
  ansible.builtin.assert:
    that:
      - __mp_kubevirt_full_definition_key.stat.isreg | default(false)
      - __mp_kubevirt_full_definition_key.stat.size | default(0) > 0
    fail_msg: >-
      vm_definition does not inject SSH access. Provide a private key at
      mp_kubevirt_ssh_key_path and configure the guest to accept its public key.
  when: __mp_kubevirt_full_definition_key is not skipped

- name: Determine whether any host needs an SSH key
  ansible.builtin.set_fact:
    __mp_kubevirt_any_ssh: >-
      {{ _mp_specs.values() | rejectattr('vm_definition', 'defined')
         | map(attribute='connection', default='ssh')
         | select('equalto', 'ssh')
         | list | length > 0
         or (_mp_specs.values() | rejectattr('vm_definition', 'defined')
             | map(attribute='cloud_init.inject_ssh_key', default=false)
             | map('bool') | select('equalto', true) | list | length > 0) }}

- name: Generate SSH key pair
  community.crypto.openssh_keypair:
    path: "{{ mp_kubevirt_ssh_key_path }}"
    type: ed25519
    regenerate: "{{ 'never' if __mp_kubevirt_full_definition_key is not skipped else omit }}"
  register: __mp_kubevirt_ssh_keypair
  when: __mp_kubevirt_any_ssh | bool

- name: Set SSH public key fact
  ansible.builtin.set_fact:
    temporary_ssh_public_key: "{{ __mp_kubevirt_ssh_keypair.public_key }}"
  when: __mp_kubevirt_any_ssh | bool

- name: Create VirtualMachine in KubeVirt
  ansible.builtin.include_tasks: _create_vm.yml
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# The Service key is named `ssh_service` for historical reasons — it predates
# Windows/WinRM support. It now fronts whatever guest port the connection uses:
# 22 for ssh, 5986 (WinRM-over-HTTPS) for psrp/winrm.
- name: Create guest NodePort Kubernetes service
  vars:
    _guest_port: >-
      {{ 5986 if (_mp_specs[item].connection | default('ssh')) in ['psrp', 'winrm'] else 22 }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ (__mp_kubevirt_run.hosts | default({})).get(item, {}).name | default(item) }}"
        namespace: "{{ _mp_specs[item].namespace }}"
        labels: >-
          {{ {'molecule-provisioners.igou.io/run-id': __mp_kubevirt_run.id}
             if mp_kubevirt_run_isolation | bool else {} }}
      spec:
        # Build the ports list as a SINGLE Jinja dict-literal expression so
        # `_guest_port | int` stays a real int. A quoted `"{{ _guest_port | int }}"`
        # YAML scalar string-coerces to "22"/"5986" on ansible-core 2.16/2.17
        # (native types only on 2.19+), and Kubernetes rejects a non-numeric
        # spec.ports[].port. Same pattern as `_entry` in _create_vm_dictionary.yml.
        ports: >-
          {{
            [
              {
                'port': _guest_port | int,
                'protocol': 'TCP',
                'targetPort': _guest_port | int
              }
            ]
          }}
        selector:
          kubevirt.io/domain: "{{ (__mp_kubevirt_run.hosts | default({})).get(item, {}).name | default(item) }}"
        type: NodePort
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'NodePort'
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# Cluster-Node lookup is only needed for NodePort hosts that don't pin their
# own connection_ip. 'None' mode requires connection_ip (validated) and
# 'PodIP' mode reads the VMI's pod address instead — skipping the lookup
# keeps namespace-scoped service accounts without cluster-wide
# `nodes [get,list]` RBAC viable. See #30.
- name: Determine whether any host needs the cluster-Node lookup
  ansible.builtin.set_fact:
    __mp_kubevirt_needs_node_lookup: >-
      {{ _mp_specs.values()
         | rejectattr('connection_ip', 'defined')
         | map(attribute='ssh_service', default={})
         | map(attribute='type', default='NodePort')
         | select('equalto', 'NodePort')
         | list | length > 0 }}

# Look up cluster nodes once, before the per-VM dictionary loop, so every VM
# without an explicit connection_ip uses the same node IP. Subsequent
# dictionary build is purely local.
- name: Look up cluster nodes (for NodePort connection IP)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: __mp_kubevirt_nodes
  when: __mp_kubevirt_needs_node_lookup

- name: Assert at least one cluster node is available
  ansible.builtin.assert:
    that: __mp_kubevirt_nodes.resources | length > 0
    fail_msg: "No cluster nodes returned from Kubernetes API. Check kubeconfig and cluster health."
  when: __mp_kubevirt_needs_node_lookup

- name: Choose first node InternalIP
  ansible.builtin.set_fact:
    __mp_kubevirt_node_ip: >-
      {{ (__mp_kubevirt_nodes.resources[0].status.addresses
          | selectattr('type', 'equalto', 'InternalIP') | list | first).address }}
  when: __mp_kubevirt_needs_node_lookup

- name: Initialize VM runtime inventory dict
  ansible.builtin.set_fact:
    __mp_kubevirt_runtime_hosts: {}

- name: Build VM runtime entries
  ansible.builtin.include_tasks: _create_vm_dictionary.yml
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# no_log: the runtime inventory now carries ansible_password for Windows
# (psrp/winrm) hosts. Keep mode restrictive (0600) since a secret lands on disk.
- name: Write runtime connection inventory file
  vars:
    runtime_inventory:
      all:
        hosts: "{{ __mp_kubevirt_runtime_hosts }}"
  ansible.builtin.copy:
    content: "{{ runtime_inventory | to_nice_yaml }}"
    dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_runtime.yml"
    mode: "0600"
  no_log: true

- name: Refresh inventory
  ansible.builtin.meta: refresh_inventory
