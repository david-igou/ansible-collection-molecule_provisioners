---
- name: Validate ssh_service.type per platform
  ansible.builtin.assert:
    that:
      - vm.kubevirt.ssh_service.type | default('NodePort')
        in mp_kubevirt_allowed_ssh_service_types
    fail_msg: >-
      Platform '{{ vm.name }}' has unsupported ssh_service.type
      '{{ vm.kubevirt.ssh_service.type }}'. v1 supports only:
      {{ mp_kubevirt_allowed_ssh_service_types | join(', ') }}.
  loop: "{{ molecule_yml.platforms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

- name: Generate SSH key pair
  community.crypto.openssh_keypair:
    path: "{{ mp_kubevirt_ssh_key_path }}"
    size: 2048
  register: __mp_kubevirt_ssh_keypair

- name: Set SSH public key fact
  ansible.builtin.set_fact:
    temporary_ssh_public_key: "{{ __mp_kubevirt_ssh_keypair.public_key }}"

- name: Create VirtualMachine in KubeVirt
  ansible.builtin.include_tasks: _create_vm.yml
  loop: "{{ molecule_yml.platforms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

- name: Create SSH NodePort Kubernetes service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ vm.name }}"
        namespace: "{{ vm.kubevirt.namespace | default(mp_kubevirt_namespace) }}"
      spec:
        ports:
          - port: 22
            protocol: TCP
            targetPort: 22
        selector:
          kubevirt.io/domain: "{{ vm.name }}"
        type: NodePort
  when: vm.kubevirt.ssh_service.type | default('') == 'NodePort'
  loop: "{{ molecule_yml.platforms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

- name: Build VM dictionary entries
  ansible.builtin.include_tasks: _create_vm_dictionary.yml
  loop: "{{ molecule_yml.platforms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

- name: Create Ansible inventory from dictionary
  vars:
    molecule_inventory:
      all:
        children:
          molecule:
            hosts: "{{ __mp_kubevirt_molecule_systems | default({}) }}"
  ansible.builtin.copy:
    content: "{{ molecule_inventory | to_nice_yaml }}"
    dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_inventory.yml"
    mode: "0600"

- name: Refresh inventory
  ansible.builtin.meta: refresh_inventory

- name: Assert molecule group exists in inventory
  ansible.builtin.assert:
    that: "'molecule' in groups"
    fail_msg: "Molecule group was not found in inventory groups: {{ groups }}"
  run_once: true  # noqa: run-once[task]
