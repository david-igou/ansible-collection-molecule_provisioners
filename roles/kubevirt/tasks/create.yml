---
- name: Validate the instance settings
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml)
         .argument_specs.instance.options }}
    provided_arguments:
      kubevirt: "{{ _mp_spec }}"

- name: Generate the SSH key pair
  community.crypto.openssh_keypair:
    path: "{{ _mp_key }}"
    type: ed25519
  run_once: true

- name: Check rules that span several settings
  ansible.builtin.assert:
    that:
      - _mp_vm.spec.template.spec.domain.devices.interfaces | map(attribute='name') | sort
        == _mp_vm.spec.template.spec.networks | map(attribute='name') | sort
      - _mp_spec.ssh_service.type != 'None' or _mp_spec.connection_ip is defined
      - _mp_spec.ssh_service.type == 'None' or _mp_pod_networks | length > 0
    fail_msg: >-
      Every interface needs a network of the same name; ssh_service.type None
      needs connection_ip; NodePort and PodIP need a pod network.

- name: Store the cloud-init data
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _mp_name }}-cloudinit"
        namespace: "{{ _mp_spec.namespace }}"
        labels: "{{ _mp_labels }}"
      data:
        userdata: "{{ ('#cloud-config\n' ~ _mp_cloud_config | to_nice_yaml(indent=2)) | b64encode }}"
        networkdata: "{{ _mp_spec.cloud_init.network_data | default({}) | to_nice_yaml(indent=2) | b64encode }}"
  when: _mp_cloud_init | bool
  no_log: "{{ _mp_spec.cloud_init.user_data is defined }}" # user data may hold credentials

- name: Create the VirtualMachine and wait until it is ready
  kubernetes.core.k8s:
    definition: "{{ _mp_vm }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: "{{ mp_kubevirt_wait_timeout }}"

- name: Publish the management and application ports
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'service.yml.j2') | from_yaml }}"
    apply: true
    server_side_apply:
      field_manager: molecule_provisioners
  register: _mp_service
  when: _mp_spec.ssh_service.type == 'NodePort'

- name: Find a node to reach the NodePorts on
  kubernetes.core.k8s_info:
    kind: Node
  register: _mp_nodes
  when:
    - _mp_spec.ssh_service.type == 'NodePort'
    - _mp_spec.connection_ip is not defined

- name: Wait for the pod network address
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ _mp_name }}"
    namespace: "{{ _mp_spec.namespace }}"
  register: _mp_vmi
  until: >-
    _mp_vmi.resources[0].status.interfaces | default([])
    | selectattr('name', 'equalto', _mp_pod_networks[0].name)
    | selectattr('ipAddress', 'defined') | list | length > 0
  retries: "{{ mp_kubevirt_wait_timeout // 5 }}"
  delay: 5
  when: _mp_spec.ssh_service.type == 'PodIP'

- name: Record the connection settings
  ansible.builtin.set_fact:
    mp_runtime: >-
      {{ lookup('ansible.builtin.template', 'runtime.yml.j2') | from_yaml
         | combine(_mp_spec.connection_vars) }}
  no_log: "{{ _mp_spec.connection_vars | length > 0 }}" # may hold passwords
