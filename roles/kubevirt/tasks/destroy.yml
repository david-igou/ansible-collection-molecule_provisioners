---
# Foreground deletion removes the VM's DataVolumes and VMI before the VM.
- name: Delete the instance resources
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ _mp_spec.namespace }}"
    label_selectors:
      - molecule-provisioners/instance={{ _mp_name }}
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: "{{ mp_kubevirt_wait_timeout }}"
  loop:
    - api_version: kubevirt.io/v1
      kind: VirtualMachine
    - api_version: v1
      kind: Service
    - api_version: v1
      kind: Secret
  loop_control:
    label: "{{ item.kind }}"
