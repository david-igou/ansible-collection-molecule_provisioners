---
- name: Load any saved run identity
  ansible.builtin.include_tasks: _load_run.yml

- name: Destroy resources using the saved mapping
  ansible.builtin.include_tasks: _destroy_run.yml
  when: __mp_kubevirt_run_file.stat.exists

- name: Explain an isolated destroy without saved state
  ansible.builtin.debug:
    msg: >-
      No kubevirt_run.yml exists; no isolated resources will be deleted.
      This is normal before create. If state was lost, restore it or follow
      the label-based recovery instructions in roles/kubevirt/README.md.
  when:
    - mp_kubevirt_run_isolation | bool
    - not __mp_kubevirt_run_file.stat.exists

- name: Destroy legacy fixed-name resources
  ansible.builtin.include_tasks: _destroy_fixed.yml
  when:
    - not mp_kubevirt_run_isolation | bool
    - not __mp_kubevirt_run_file.stat.exists
