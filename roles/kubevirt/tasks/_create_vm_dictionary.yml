---
# NodePort lookup is skipped in 'None' and 'PodIP' modes — no Service was
# created. In 'None' mode the consumer-supplied connection_ip +
# ssh_service.port (default 22) carry the connection; in 'PodIP' mode the
# VMI's pod-network address does.
- name: "Look up NodePort service for: {{ item }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ (__mp_kubevirt_run.hosts | default({})).get(item, {}).name | default(item) }}"
    namespace: "{{ _mp_specs[item].namespace }}"
  register: __mp_kubevirt_svc
  until:
    - __mp_kubevirt_svc.resources | length > 0
    - >-
      (__mp_kubevirt_svc.resources[0].spec.ports
       | selectattr('name', 'defined') | selectattr('name', 'equalto', 'management')
       | map(attribute='nodePort', default=0) | first | default(0)) | int > 0
  retries: 10
  delay: 3
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'NodePort'

# PodIP mode reads the VMI's pod-network address (masquerade interface =
# virt-launcher pod IP), which appears in VMI status once the launcher pod is
# up. Bounded by mp_kubevirt_podip_lookup_retries x _delay.
- name: Identify the configured pod network for management
  vars:
    _default_networks:
      - name: default
        pod: {}
    _definition_guest: "{{ _mp_specs[item].vm_definition.spec.template.spec | default({}) }}"
    _definition_networks: >-
      {{ _definition_guest.networks | default([])
         or (_default_networks
             if _definition_guest.domain.devices.autoattachPodInterface | default(true) | bool else []) }}
    _networks: >-
      {{ _definition_networks if _mp_specs[item].vm_definition is defined
         else ((_mp_specs[item].networks | default(_default_networks))
               + (_mp_specs[item].extra_networks | default([]))) }}
  ansible.builtin.set_fact:
    __mp_kubevirt_pod_network_name: >-
      {{ (_networks | selectattr('pod', 'defined') | first).name }}
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'PodIP'

- name: "Look up VMI pod IP for: {{ item }}"
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ (__mp_kubevirt_run.hosts | default({})).get(item, {}).name | default(item) }}"
    namespace: "{{ _mp_specs[item].namespace }}"
  register: __mp_kubevirt_vmi
  until:
    - __mp_kubevirt_vmi.resources | length > 0
    - >-
      (__mp_kubevirt_vmi.resources[0].status.interfaces | default([])
       | selectattr('name', 'defined')
       | selectattr('name', 'equalto', __mp_kubevirt_pod_network_name)
       | map(attribute='ipAddress', default='') | reject('equalto', '') | list | length) > 0
  retries: "{{ mp_kubevirt_podip_lookup_retries }}"
  delay: "{{ mp_kubevirt_podip_lookup_delay }}"
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'PodIP'

- name: Build connection defaults and application endpoints
  ansible.builtin.include_tasks: _build_runtime.yml
