---
- name: Check directly managed resources for this run
  ansible.builtin.include_tasks: _check_owned.yml
  loop: >-
    {{ [{'api': 'kubevirt.io/v1', 'kind': 'VirtualMachine', 'name': run_host.value.name}]
       + ([{'api': 'v1', 'kind': 'Service', 'name': run_host.value.name}] if run_host.value.service else []) }}
  loop_control:
    loop_var: run_resource
    label: "{{ run_resource.kind }}/{{ run_resource.name }}"

# CDI creates the PVC and owns it via the generated DataVolume. Do not adopt a
# pre-existing claim with the generated name, even if no VM exists yet.
- name: Check every managed DataVolume and claim
  ansible.builtin.include_tasks: _check_data_volume.yml
  loop: "{{ run_host.value.data_volumes | default([run_host.value.name ~ '-boot'] if run_host.value.disk else []) }}"
  loop_control:
    loop_var: data_volume_name
