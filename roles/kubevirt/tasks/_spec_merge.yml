---
- name: Initialize kubevirt spec map
  ansible.builtin.set_fact:
    _mp_specs: {}

- name: Merge per-host specs with mp_defaults and role defaults
  vars:
    _user_spec: >-
      {{ (mp_defaults['kubevirt'] | default({}))
         | combine((hostvars[item].mp | default({}))['kubevirt'] | default({})) }}
    _defaults: >-
      {{ (mp_kubevirt_role_defaults | dict2items
          | selectattr('key', 'in', ['namespace', 'ssh_user', 'connection', 'ssh_service',
                                   'connection_ip', 'admin_user', 'admin_password',
                                   'connection_vars', 'application_ports']) | items2dict)
         if _user_spec.vm_definition is defined else mp_kubevirt_role_defaults }}
  ansible.builtin.set_fact:
    _mp_specs: "{{ _mp_specs | combine({item: _defaults | combine(_user_spec)}) }}"
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
