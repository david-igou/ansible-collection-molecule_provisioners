---
# Per-host validation. Operates on _mp_specs[item] (populated upstream in
# create.yml by the merge loop, or by the unit-test harness).

- name: "Assert boot_source is defined: {{ item }}"
  ansible.builtin.assert:
    that:
      - "'boot_source' in _mp_specs[item]"
      - _mp_specs[item].boot_source is mapping
      - "'type' in _mp_specs[item].boot_source"
    fail_msg: >-
      Host '{{ item }}' is missing `mp.kubevirt.boot_source`. Set it to
      one of: container_disk, data_volume_url, data_volume_pvc,
      data_volume_source_ref, pvc.

- name: "Assert boot_source.type is supported: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.type in
        ['container_disk', 'data_volume_url', 'data_volume_pvc',
         'data_volume_source_ref', 'pvc']
    fail_msg: >-
      Host '{{ item }}' has unsupported boot_source.type
      '{{ _mp_specs[item].boot_source.type }}'. Supported:
      container_disk, data_volume_url, data_volume_pvc,
      data_volume_source_ref, pvc.

- name: "Assert container_disk required fields: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.image is defined
      - _mp_specs[item].boot_source.image | length > 0
    fail_msg: "Host '{{ item }}' boot_source.type=container_disk requires `image`."
  when: _mp_specs[item].boot_source.type == 'container_disk'

- name: "Assert data_volume_url required fields: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.url is defined
      - _mp_specs[item].boot_source.size is defined
    fail_msg: >-
      Host '{{ item }}' boot_source.type=data_volume_url requires `url` and `size`.
  when: _mp_specs[item].boot_source.type == 'data_volume_url'

- name: "Assert data_volume_pvc required fields: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.source is defined
      - _mp_specs[item].boot_source.source.name is defined
      - _mp_specs[item].boot_source.source.namespace is defined
      - _mp_specs[item].boot_source.size is defined
    fail_msg: >-
      Host '{{ item }}' boot_source.type=data_volume_pvc requires
      source.name, source.namespace, and size.
  when: _mp_specs[item].boot_source.type == 'data_volume_pvc'

- name: "Assert data_volume_source_ref required fields: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.source_ref is defined
      - _mp_specs[item].boot_source.source_ref.name is defined
      - _mp_specs[item].boot_source.source_ref.namespace is defined
      - _mp_specs[item].boot_source.size is defined
    fail_msg: >-
      Host '{{ item }}' boot_source.type=data_volume_source_ref requires
      source_ref.name, source_ref.namespace, and size.
  when: _mp_specs[item].boot_source.type == 'data_volume_source_ref'

- name: "Assert pvc required fields: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].boot_source.name is defined
      - _mp_specs[item].boot_source.name | length > 0
    fail_msg: "Host '{{ item }}' boot_source.type=pvc requires `name` (the PVC name)."
  when: _mp_specs[item].boot_source.type == 'pvc'

# An unset ssh_service.type defaults to NodePort here AND in create.yml's
# "Create SSH NodePort Kubernetes service" when-guard. Keep both expressions
# in sync — if you change the default here, change it there too.
- name: "Assert ssh_service.type is supported: {{ item }}"
  ansible.builtin.assert:
    that:
      - (_mp_specs[item].ssh_service.type | default('NodePort'))
        in mp_kubevirt_allowed_ssh_service_types
    fail_msg: >-
      Host '{{ item }}' has unsupported ssh_service.type
      '{{ _mp_specs[item].ssh_service.type | default('(missing)') }}'.
      Supported: {{ mp_kubevirt_allowed_ssh_service_types | join(', ') }}.

# 'None' mode skips Service creation, so the role has no way to discover a
# connection IP on its own — the consumer must supply one.
- name: "Assert connection_ip is set when ssh_service.type is None: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].connection_ip is defined
      - _mp_specs[item].connection_ip | length > 0
    fail_msg: >-
      Host '{{ item }}' uses ssh_service.type=None but did not set
      connection_ip. With no Service, the role has no way to reach
      the VM. Set mp.kubevirt.connection_ip to a controller-reachable
      address (e.g. external Route IP, pod IP).
  when: (_mp_specs[item].ssh_service.type | default('NodePort')) == 'None'

# connection discriminates guest handling: ssh (default, Linux/cloud-init) vs
# psrp/winrm (Windows WinRM-over-HTTPS). See roles/kubevirt/README.md.
- name: "Assert connection is supported: {{ item }}"
  ansible.builtin.assert:
    that:
      - (_mp_specs[item].connection | default('ssh')) in mp_kubevirt_allowed_connections
    fail_msg: >-
      Host '{{ item }}' has unsupported connection
      '{{ _mp_specs[item].connection | default('(missing)') }}'.
      Supported: {{ mp_kubevirt_allowed_connections | join(', ') }}.

# psrp/winrm authenticate with a local admin whose password the sysprep
# unattend.xml set. Fail fast (before we ever start a VM) if it is missing.
- name: "Assert admin_password is set for psrp/winrm: {{ item }}"
  ansible.builtin.assert:
    that:
      - _mp_specs[item].admin_password is defined
      - _mp_specs[item].admin_password | default('') | length > 0
    fail_msg: >-
      Host '{{ item }}' uses connection
      '{{ _mp_specs[item].connection | default('ssh') }}' but did not set
      admin_password. WinRM authentication needs the local admin password that
      the sysprep unattend.xml assigned. Set mp.kubevirt.admin_password
      (typically via a scenario group_var doing an env/op lookup).
  # no no_log: the `that:` conditions only test presence/length (never
  # interpolate the password value) and fail_msg prints connection type, not
  # the secret — so the fail_msg stays visible when the assert trips.
  when: (_mp_specs[item].connection | default('ssh')) in ['psrp', 'winrm']

- name: "Warn if instancetype is set alongside cpu/memory_limit: {{ item }}"
  ansible.builtin.debug:
    msg: >-
      Host '{{ item }}' sets both `instancetype` and `cpu`/`memory_limit`.
      The renderer suppresses domain.cpu and domain.resources when instancetype
      is set, so the cpu/memory_limit values will be ignored.
  when:
    - _mp_specs[item].instancetype is defined
    - (_mp_specs[item].cpu is defined or _mp_specs[item].memory_limit is defined)
