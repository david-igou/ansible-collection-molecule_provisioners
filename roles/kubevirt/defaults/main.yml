---
# Every host's VM starts from this dict. mp_defaults.kubevirt and then the
# host's mp.kubevirt are merged over it (recursively). The merged result is
# validated against the `instance` entry point in meta/argument_specs.yml.
mp_kubevirt_instance_defaults:
  namespace: molecule
  ssh_user: cloud-user
  connection: ssh
  connection_vars: {}
  cloud_init: {}
  interfaces:
    - name: default
      masquerade: {}
  networks:
    - name: default
      pod: {}
  boot_disk: {}
  data_disks: []
  node_selector: {}
  tolerations: []
  affinity: {}
  ssh_service:
    type: NodePort
  application_ports: []
  vm_overrides: {}

# Seconds to wait for a VM to become Ready (including disk imports), for its
# pod IP, for deletion, and in prepare for an SSH guest to accept connections.
mp_kubevirt_wait_timeout: 600

# Seconds prepare waits for a Windows (psrp/winrm) guest. Sysprep specialize
# and first-logon commands run before WinRM answers.
mp_kubevirt_windows_wait_timeout: 900
