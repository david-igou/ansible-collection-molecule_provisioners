---
- name: Create the networks
  community.docker.docker_network:
    name: "{{ item.name }}"
  module_defaults:
    community.docker.docker_network: "{{ item }}"
  loop: "{{ mp_docker_networks }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true

- name: Start the container
  community.docker.docker_container:
    name: "{{ inventory_hostname }}"
    state: started
  module_defaults:
    community.docker.docker_container: "{{ _mp_spec }}"

- name: Give a failing container command time to exit
  ansible.builtin.pause:
    seconds: 2

- name: Read the container state
  community.docker.docker_container_info:
    name: "{{ inventory_hostname }}"
  register: _mp_docker_info
  no_log: true # the container environment may hold secrets

- name: Check that the container is still running
  vars:
    _mp_state: "{{ _mp_docker_info.container.State }}"
  ansible.builtin.assert:
    that: _mp_state.Running
    fail_msg: >-
      Container {{ inventory_hostname }} exited with code {{ _mp_state.ExitCode }}.
      Run `docker logs {{ inventory_hostname }}` to see why; the image may need
      a different command.
    quiet: true

- name: Record the connection settings
  ansible.builtin.set_fact:
    mp_runtime:
      ansible_connection: community.docker.docker
      ansible_user: "{{ ansible_user | default('root') }}"
