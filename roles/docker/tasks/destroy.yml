---
- name: Remove the container
  community.docker.docker_container:
    name: "{{ inventory_hostname }}"
    state: absent

- name: Remove the networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: absent
  loop: "{{ mp_docker_networks }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true
