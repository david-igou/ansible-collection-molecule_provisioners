---
argument_specs:
  create:
    short_description: Start one Docker container per molecule host
    description:
      - Each host's container is C(mp_docker_instance_defaults), then
        C(mp_defaults.docker), then the host's C(mp.docker), merged in that
        order and passed to M(community.docker.docker_container). Any option
        of that module can be set; the container name is the inventory hostname.
    options:
      mp_docker_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.docker and mp.docker.
      mp_docker_networks:
        type: list
        elements: dict
        default: []
        description: M(community.docker.docker_network) arguments, one dict per network.
  destroy:
    short_description: Remove the containers and networks
    options:
      mp_docker_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.docker and mp.docker.
      mp_docker_networks:
        type: list
        elements: dict
        default: []
        description: M(community.docker.docker_network) arguments, one dict per network.
  prepare:
    short_description: Wait until each container can run Ansible modules
    options: {}
