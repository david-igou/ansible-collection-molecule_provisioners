---
argument_specs:
  main:
    short_description: Docker containers as Molecule instances
    description:
      - Not called directly. Scenarios import the collection's C(create),
        C(prepare) and C(destroy) playbooks, which include this role's entry
        point of the same name when C(mp_backend) is C(docker).
    options: {}
  create:
    short_description: Start one Docker container per molecule host
    description:
      - Each host's container is C(mp_docker_instance_defaults), then
        C(mp_defaults.docker), then the host's C(mp.docker), merged in that
        order and passed to M(community.docker.docker_container). Any option
        of that module can be set; the container name is the inventory hostname.
    options:
      mp_docker_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.docker and mp.docker.
      mp_docker_networks:
        type: list
        elements: dict
        default: []
        description: M(community.docker.docker_network) arguments, one dict per network.
  destroy:
    short_description: Remove the containers and networks
    description:
      - Removes each host's container, then the networks in C(mp_docker_networks).
        Succeeds when nothing exists.
    options:
      mp_docker_instance_defaults:
        type: dict
        description: Container settings applied before mp_defaults.docker and mp.docker.
      mp_docker_networks:
        type: list
        elements: dict
        default: []
        description: M(community.docker.docker_network) arguments, one dict per network.
  prepare:
    short_description: Wait until each container can run Ansible modules
    description:
      - Waits up to 60 seconds for each container to run an Ansible module, which
        catches images without Python before converge.
    options: {}
