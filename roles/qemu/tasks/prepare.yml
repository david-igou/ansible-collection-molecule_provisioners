---
- name: Wait for the guest
  block:
    - name: Wait for an Ansible connection
      ansible.builtin.wait_for_connection:
        timeout: "{{ mp_qemu_wait_timeout }}"
  rescue:
    - name: Read the end of the serial log
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "40"
          - "{{ _mp_file }}.log"
      delegate_to: localhost
      register: _mp_serial
      changed_when: false
      failed_when: false

    - name: Report the unreachable guest
      ansible.builtin.fail:
        msg: |-
          {{ inventory_hostname }} did not accept a connection within {{ mp_qemu_wait_timeout }}s:
          {{ ansible_failed_result.msg | default('') }}
          Last lines of {{ _mp_file }}.log:
          {{ _mp_serial.stdout | default('') | regex_replace('\x1b\[[0-9;]*m|\r', '') }}
