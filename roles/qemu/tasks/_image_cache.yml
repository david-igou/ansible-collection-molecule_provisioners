---
# For each unique image URL, ensure a cached base qcow2 exists.
# Cache layout: {{ mp_qemu_image_cache_dir }}/<sha256-of-url>/disk.qcow2
#
# Compressed / non-qcow2 support: each upstream artifact is sniffed by content
# (file --brief --mime-type), decompressed by detected type (xz/gz/bz2 via
# community.general.decompress, zip via ansible.builtin.unarchive), then its
# real disk format is detected with `qemu-img info` and converted to qcow2 when
# it isn't already (e.g. a raw .img). Detection is by content, not URL
# extension, so redirect-served artifacts are handled correctly. The final
# cached file is always a bare qcow2 regardless of upstream compression/format.
# Per-image ingestion lives in _cache_image.yml.
- name: Determine unique image specs
  ansible.builtin.set_fact:
    _mp_qemu_unique_images: >-
      {{ dict(groups['molecule']
         | map('extract', _mp_specs, 'image')
         | zip(groups['molecule']
               | map('extract', _mp_specs)
               | map(attribute='image_checksum') | map('default', None))
         | list) }}
  # Build a dict {url: checksum_or_none} without requiring image_checksum key.
  # map(attribute='image_checksum') returns Undefined for hosts without it;
  # piping through map('default', None) converts Undefined to None.
  # dict() collapses duplicate URLs keeping the last value seen — fine since
  # the same URL carries the same checksum.

- name: Cache each unique base image
  ansible.builtin.include_tasks: _cache_image.yml
  loop: "{{ _mp_qemu_unique_images | dict2items }}"
  loop_control:
    loop_var: _mp_qemu_image
    label: "{{ _mp_qemu_image.key }}"

- name: Record cached base path per host in _mp_specs
  ansible.builtin.set_fact:
    _mp_specs: >-
      {{ _mp_specs | combine({
           item: _mp_specs[item] | combine({
             'base_image_path':
               mp_qemu_image_cache_dir ~ '/'
               ~ (_mp_specs[item].image | ansible.builtin.hash('sha256'))
               ~ '/disk.qcow2'
           })
         }, recursive=True) }}
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"
