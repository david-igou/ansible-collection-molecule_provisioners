---
- name: qemu | Inspect root image sizes
  ansible.builtin.command:
    argv:
      - qemu-img
      - info
      - --output=json
      - "{{ _mp_specs[item].base_image_path }}"
  loop: "{{ groups['molecule'] }}"
  register: __mp_qemu_root_sizes
  changed_when: false

- name: qemu | Reject implicit root disk shrink
  ansible.builtin.assert:
    that: >-
      not _mp_specs[item.item].disk_size | default('')
      or (_mp_specs[item.item].disk_size | david_igou.molecule_provisioners.qemu_size)
         >= (item.stdout | from_json)['virtual-size']
    fail_msg: disk_size is smaller than the backing image; use a larger absolute size.
  loop: "{{ __mp_qemu_root_sizes.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: qemu | Create root disk once
  vars:
    __size: "{{ [_mp_specs[item].disk_size] if _mp_specs[item].disk_size | default('') else [] }}"
  ansible.builtin.command:
    argv: >-
      {{ ['qemu-img', 'create', '-f', 'qcow2', '-F', 'qcow2', '-b',
          _mp_specs[item].base_image_path, _mp_qemu_run.hosts[item].overlay] + __size }}
    creates: "{{ _mp_qemu_run.hosts[item].overlay }}"
  loop: "{{ groups['molecule'] }}"

- name: qemu | Protect root overlays
  ansible.builtin.file:
    path: "{{ _mp_qemu_run.hosts[item].overlay }}"
    state: file
    mode: "0600"
  loop: "{{ groups['molecule'] }}"
