---
# Per-host process-driver launch. KVM detection runs once at the top of create
# and stashes a fact; here we just consume it.

# Reap stale qemu pidfile before launch. qemu -daemonize won't overwrite an
# existing pidfile, and the launch task's `creates:` would skip starting qemu
# if a pidfile from a previous run remained on disk while the qemu process is
# gone. Drops the pidfile if it's empty, malformed, or its PID isn't live;
# leaves it alone if a live process still owns it (so `creates:` still skips).
- name: "Reap stale qemu pidfile for {{ item }}"
  ansible.builtin.shell: |
    set -eu
    pidfile="{{ molecule_ephemeral_directory }}/{{ item }}.pid"
    [ -f "$pidfile" ] || exit 0
    pid=$(tr -d '[:space:]' < "$pidfile" || true)
    if [ -z "$pid" ] || ! kill -0 "$pid" 2>/dev/null; then
      rm -f "$pidfile"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# UEFI images need a writable per-VM copy of OVMF_VARS.fd for UEFI variable
# persistence across reboots and initial boot. OVMF_CODE.fd is read-only and
# shared. Copy only when firmware: uefi is requested for this host.
- name: "Copy writable UEFI OVMF_VARS for {{ item }}"
  ansible.builtin.copy:
    src: "{{ mp_qemu_ovmf_vars }}"
    dest: "{{ molecule_ephemeral_directory }}/{{ item }}-ovmf-vars.fd"
    mode: "0600"
    remote_src: false
  when: _mp_specs[item].firmware | default('bios') == 'uefi'
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# Launch BIOS-firmware VMs (default). Skipped when firmware: uefi is set.
- name: "Launch qemu-system (bios) for {{ item }}"
  vars:
    _ssh_port: "{{ mp_qemu_slirp_port_base | int + (groups['molecule'].index(item) | int) }}"
    _accel: "{{ 'kvm:tcg' if _mp_qemu_kvm_ok | default(false) else 'tcg' }}"
    # Default 'host' under KVM (full feature passthrough), 'qemu64-v2' under
    # TCG. Without an explicit -cpu, qemu falls through to a model that strips
    # x86-64-v2 features and RHEL/Rocky/CentOS 9+ panic at first userspace
    # process because glibc requires v2.
    _cpu_model: >-
      {{ _mp_specs[item].cpu_model
         | default('host' if _mp_qemu_kvm_ok | default(false) else 'qemu64-v2', true) }}
  ansible.builtin.command:
    argv:
      - qemu-system-x86_64
      - -machine
      - "accel={{ _accel }}"
      - -cpu
      - "{{ _cpu_model }}"
      - -m
      - "{{ _mp_specs[item].memory | int }}"
      - -smp
      - "{{ _mp_specs[item].cpus | int }}"
      - -drive
      - "file={{ _mp_specs[item].overlay_path }},if=virtio,format=qcow2"
      - -cdrom
      - "{{ _mp_specs[item].seed_iso_path }}"
      - -netdev
      - "user,id=net0,hostfwd=tcp::{{ _ssh_port }}-:22"
      - -device
      - virtio-net-pci,netdev=net0
      - -daemonize
      - -pidfile
      - "{{ molecule_ephemeral_directory }}/{{ item }}.pid"
      - -qmp
      - "unix:{{ molecule_ephemeral_directory }}/{{ item }}.qmp,server,nowait"
      - -display
      - "none"
    creates: "{{ molecule_ephemeral_directory }}/{{ item }}.pid"
  when: _mp_specs[item].firmware | default('bios') != 'uefi'
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

# Launch UEFI-firmware VMs. pflash drives must appear before -machine to ensure
# OVMF is loaded before the main disk; OVMF_CODE.fd is read-only (shared
# across VMs), OVMF_VARS.fd is the per-VM writable copy created above.
- name: "Launch qemu-system (uefi) for {{ item }}"
  vars:
    _ssh_port: "{{ mp_qemu_slirp_port_base | int + (groups['molecule'].index(item) | int) }}"
    _accel: "{{ 'kvm:tcg' if _mp_qemu_kvm_ok | default(false) else 'tcg' }}"
    _ovmf_vars_path: "{{ molecule_ephemeral_directory }}/{{ item }}-ovmf-vars.fd"
    _cpu_model: >-
      {{ _mp_specs[item].cpu_model
         | default('host' if _mp_qemu_kvm_ok | default(false) else 'qemu64-v2', true) }}
  ansible.builtin.command:
    argv:
      - qemu-system-x86_64
      - -drive
      - "if=pflash,format=raw,readonly=on,file={{ mp_qemu_ovmf_code }}"
      - -drive
      - "if=pflash,format=raw,file={{ _ovmf_vars_path }}"
      - -machine
      - "accel={{ _accel }}"
      - -cpu
      - "{{ _cpu_model }}"
      - -m
      - "{{ _mp_specs[item].memory | int }}"
      - -smp
      - "{{ _mp_specs[item].cpus | int }}"
      - -drive
      - "file={{ _mp_specs[item].overlay_path }},if=virtio,format=qcow2"
      - -cdrom
      - "{{ _mp_specs[item].seed_iso_path }}"
      - -netdev
      - "user,id=net0,hostfwd=tcp::{{ _ssh_port }}-:22"
      - -device
      - virtio-net-pci,netdev=net0
      - -daemonize
      - -pidfile
      - "{{ molecule_ephemeral_directory }}/{{ item }}.pid"
      - -qmp
      - "unix:{{ molecule_ephemeral_directory }}/{{ item }}.qmp,server,nowait"
      - -display
      - "none"
    creates: "{{ molecule_ephemeral_directory }}/{{ item }}.pid"
  when: _mp_specs[item].firmware | default('bios') == 'uefi'
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"

- name: Record slirp ssh_port per host
  ansible.builtin.set_fact:
    _mp_specs: >-
      {{ _mp_specs | combine({
           item: _mp_specs[item] | combine({
             'ssh_host': '127.0.0.1',
             'ssh_port': (mp_qemu_slirp_port_base | int + (groups['molecule'].index(item) | int))
           })
         }, recursive=True) }}
  loop: "{{ groups['molecule'] }}"
  loop_control:
    label: "{{ item }}"
