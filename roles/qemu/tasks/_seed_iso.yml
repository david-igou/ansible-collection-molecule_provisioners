---
- name: qemu | Generate bootstrap SSH key only when requested
  community.crypto.openssh_keypair:
    path: "{{ mp_qemu_ssh_key_path }}"
    type: ed25519
    mode: "0600"
  register: __mp_qemu_ssh_keypair
  when: _mp_specs.values() | selectattr('cloud_init.inject_ssh_key') | list | length > 0

- name: qemu | Record public bootstrap key
  ansible.builtin.set_fact:
    temporary_ssh_public_key: "{{ __mp_qemu_ssh_keypair.public_key | default('') }}"

- name: qemu | Find cloud-localds
  ansible.builtin.command: which cloud-localds
  register: __mp_qemu_cloudlocalds
  changed_when: false
  failed_when: false

- name: qemu | Resolve seed templates
  ansible.builtin.set_fact:
    _mp_qemu_template_dir: >-
      {{ mp_qemu_template_dir_override
         | default((role_path | default(playbook_dir ~ '/../roles/qemu')) ~ '/templates') }}

- name: qemu | Build immutable per-guest seed media
  ansible.builtin.include_tasks: _seed_iso_host.yml
  loop: "{{ groups['molecule'] }}"
  loop_control:
    loop_var: _seed_iso_host
  when: _mp_specs[_seed_iso_host].cloud_init.enabled
