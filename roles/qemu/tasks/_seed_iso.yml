---
# Generate SSH keypair once for the whole molecule run.
- name: Generate SSH key pair
  community.crypto.openssh_keypair:
    path: "{{ mp_qemu_ssh_key_path }}"
    type: ed25519
  register: __mp_qemu_ssh_keypair

- name: Surface SSH public key
  ansible.builtin.set_fact:
    temporary_ssh_public_key: "{{ __mp_qemu_ssh_keypair.public_key }}"

- name: Detect cloud-localds availability
  ansible.builtin.command: which cloud-localds
  register: __mp_qemu_cloudlocalds
  changed_when: false
  failed_when: false

# Resolve template directory: role_path is set when invoked via include_role;
# mp_qemu_template_dir_override can be set by callers (e.g. integration tests)
# that include tasks directly without a role context.
- name: Resolve template directory
  ansible.builtin.set_fact:
    _mp_qemu_template_dir: >-
      {{ mp_qemu_template_dir_override
         | default(role_path ~ '/templates'
                   if role_path is defined
                   else (playbook_dir ~ '/../roles/qemu/templates')) }}

- name: Build per-host seed ISO
  ansible.builtin.include_tasks: _seed_iso_host.yml
  loop: "{{ groups['molecule'] }}"
  loop_control:
    loop_var: _seed_iso_host
    label: "{{ _seed_iso_host }}"
