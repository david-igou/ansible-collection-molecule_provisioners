---
- name: qemu | Inspect existing bootstrap media
  ansible.builtin.stat:
    path: "{{ _mp_qemu_run.hosts[_seed_iso_host].seed_iso }}"
  register: __mp_qemu_seed

- name: qemu | Render first-boot configuration
  when: not __mp_qemu_seed.stat.exists
  no_log: true
  block:
    - name: qemu | Create private bootstrap directory
      ansible.builtin.file:
        path: "{{ _mp_qemu_run.hosts[_seed_iso_host].cidata }}"
        state: directory
        mode: "0700"

    - name: qemu | Build stable instance metadata
      ansible.builtin.set_fact:
        _mp_qemu_metadata: >-
          {{ {'local-hostname': _seed_iso_host}
             | combine(_mp_specs[_seed_iso_host].cloud_init.metadata | default({}))
             | combine({'instance-id': _mp_qemu_run.hosts[_seed_iso_host].vm_uuid}) }}

    - name: qemu | Render bootstrap files
      vars:
        _host: "{{ _seed_iso_host }}"
      ansible.builtin.template:
        src: "{{ _mp_qemu_template_dir }}/{{ item }}.j2"
        dest: "{{ _mp_qemu_run.hosts[_seed_iso_host].cidata }}/{{ item }}"
        mode: "0600"
      loop:
        - user-data
        - meta-data

    - name: qemu | Render network configuration
      vars:
        _host: "{{ _seed_iso_host }}"
      ansible.builtin.template:
        src: "{{ _mp_qemu_template_dir }}/network-config.j2"
        dest: "{{ _mp_qemu_run.hosts[_seed_iso_host].cidata }}/network-config"
        mode: "0600"
      when: _mp_specs[_seed_iso_host].cloud_init.network_data | default({}) | length > 0

    - name: qemu | Build seed using cloud-localds
      vars:
        __network_args: >-
          {{ ['--network-config', _mp_qemu_run.hosts[_seed_iso_host].cidata ~ '/network-config']
             if _mp_specs[_seed_iso_host].cloud_init.network_data | default({}) | length > 0 else [] }}
      ansible.builtin.command:
        argv: >-
          {{ ['cloud-localds'] + __network_args + [
             _mp_qemu_run.hosts[_seed_iso_host].seed_iso,
             _mp_qemu_run.hosts[_seed_iso_host].cidata ~ '/user-data',
             _mp_qemu_run.hosts[_seed_iso_host].cidata ~ '/meta-data'] }}
        creates: "{{ _mp_qemu_run.hosts[_seed_iso_host].seed_iso }}"
      when: __mp_qemu_cloudlocalds.rc == 0

    - name: qemu | Build seed using genisoimage
      ansible.builtin.command:
        argv:
          - genisoimage
          - -output
          - "{{ _mp_qemu_run.hosts[_seed_iso_host].seed_iso }}"
          - -volid
          - cidata
          - -joliet
          - -rock
          - "{{ _mp_qemu_run.hosts[_seed_iso_host].cidata }}"
        creates: "{{ _mp_qemu_run.hosts[_seed_iso_host].seed_iso }}"
      when: __mp_qemu_cloudlocalds.rc != 0

    - name: qemu | Protect generated seed media
      ansible.builtin.file:
        path: "{{ _mp_qemu_run.hosts[_seed_iso_host].seed_iso }}"
        state: file
        mode: "0600"
