---
- name: qemu | Merge per-host specifications
  ansible.builtin.include_tasks: _spec_merge.yml

- name: qemu | Validate merged specifications
  ansible.builtin.include_tasks: _validate.yml

- name: qemu | Verify controller capabilities before allocating resources
  ansible.builtin.include_tasks: _capabilities.yml

- name: qemu | Reserve run identity and endpoints
  ansible.builtin.include_tasks: _run_state.yml

- name: qemu | Ensure private image cache directory
  ansible.builtin.file:
    path: "{{ mp_qemu_image_cache_dir }}"
    state: directory
    mode: "0700"

- name: qemu | Cache base images
  ansible.builtin.include_tasks: _image_cache.yml

- name: qemu | Build bootstrap media
  ansible.builtin.include_tasks: _seed_iso.yml

- name: qemu | Create root overlays
  ansible.builtin.include_tasks: _overlay.yml

- name: qemu | Create managed data disks
  ansible.builtin.include_tasks: _data_disks.yml

- name: qemu | Inspect KVM availability
  ansible.builtin.stat:
    path: /dev/kvm
  register: __mp_qemu_kvm_stat

- name: qemu | Select acceleration
  ansible.builtin.set_fact:
    _mp_qemu_kvm_ok: >-
      {{ __mp_qemu_kvm_stat.stat.exists
         and __mp_qemu_kvm_stat.stat.readable
         and __mp_qemu_kvm_stat.stat.writeable }}

- name: qemu | Launch guests in socket listener order
  ansible.builtin.include_tasks: _launch_host.yml
  loop: "{{ _mp_qemu_run.launch_order }}"
  loop_control:
    loop_var: __mp_qemu_host

- name: qemu | Write runtime connection inventory
  ansible.builtin.include_tasks: _runtime_inventory.yml
