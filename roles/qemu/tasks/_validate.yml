---
- name: qemu | Reject invalid inputs before side effects
  ansible.builtin.assert:
    that: _mp_specs | david_igou.molecule_provisioners.qemu_valid
    fail_msg: Invalid QEMU host specification.

- name: qemu | Validate and normalize merged host specifications
  ansible.builtin.set_fact:
    _mp_specs: "{{ _mp_specs | david_igou.molecule_provisioners.qemu_specs }}"
  no_log: true
