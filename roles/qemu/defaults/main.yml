---
# Settings every guest starts from. mp_defaults.qemu and then each host's
# mp.qemu are merged over this dict. The schema is the role's "instance"
# argument spec. `image` has no default and is required.
mp_qemu_instance_defaults:
  image_checksum: ""
  cpus: 2
  memory: 1024
  ssh_user: cloud-user
  firmware: bios
  cpu_model: ""
  disk_size: ""
  cloud_init:
    user_data: {}
    network_data: {}
  data_disks: []
  extra_args: []

# Downloaded and decompressed images are kept here between runs.
mp_qemu_cache_dir: >-
  {{ lookup('ansible.builtin.env', 'XDG_CACHE_HOME')
     | default(lookup('ansible.builtin.env', 'HOME') ~ '/.cache', true) }}/molecule_provisioners/qemu
mp_qemu_download_timeout: 60

mp_qemu_binary: qemu-system-x86_64

# Guest SSH is forwarded from 127.0.0.1. Each run takes a block of 20 ports
# derived from its run id so concurrent scenarios rarely collide.
mp_qemu_ssh_port_base: 20000

# Seconds prepare waits for the guest to accept an Ansible connection.
mp_qemu_wait_timeout: 300
# Seconds destroy waits for a guest to exit after SIGTERM.
mp_qemu_stop_timeout: 30

# UEFI firmware. The vars store is copied per guest.
mp_qemu_ovmf_code: >-
  {{ lookup('ansible.builtin.first_found', mp_qemu_ovmf_code_paths, skip=true) }}
mp_qemu_ovmf_vars: "{{ mp_qemu_ovmf_code | replace('_CODE', '_VARS') }}"
mp_qemu_ovmf_code_paths:
  - /usr/share/edk2/ovmf/OVMF_CODE.fd
  - /usr/share/OVMF/OVMF_CODE_4M.fd
  - /usr/share/OVMF/OVMF_CODE.fd
  - /usr/share/edk2/x64/OVMF_CODE.4m.fd
  - /usr/share/qemu/ovmf-x86_64-code.bin
