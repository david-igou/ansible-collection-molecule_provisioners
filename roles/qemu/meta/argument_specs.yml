---
argument_specs:
  create:
    short_description: Boot one QEMU guest per molecule host
    description:
      - Each host's guest is C(mp_qemu_instance_defaults), then C(mp_defaults.qemu),
        then the host's C(mp.qemu), merged in that order and validated against the
        C(instance) entry point.
      - Guests run as daemonized C(qemu-system-x86_64) processes with user-mode
        networking and SSH forwarded from 127.0.0.1.
    options:
      mp_qemu_instance_defaults:
        type: dict
        description: Guest settings applied before mp_defaults.qemu and mp.qemu.
      mp_qemu_cache_dir:
        type: path
        default: ~/.cache/molecule_provisioners/qemu
        description: Image cache, honouring C(XDG_CACHE_HOME).
      mp_qemu_download_timeout:
        type: int
        default: 60
        description: Read timeout in seconds for image downloads.
      mp_qemu_binary:
        type: str
        default: qemu-system-x86_64
        description: QEMU system emulator.
      mp_qemu_ssh_port_base:
        type: int
        default: 20000
        description:
          - First forwarded SSH port. Each run uses a block of 20 ports picked
            from its run id within the 10000 ports above this base.
      mp_qemu_ovmf_code:
        type: path
        description: UEFI firmware code image. Defaults to the first of C(mp_qemu_ovmf_code_paths) that exists.
      mp_qemu_ovmf_vars:
        type: path
        description: UEFI variable store template. Defaults to C(mp_qemu_ovmf_code) with C(_CODE) replaced by C(_VARS).
      mp_qemu_ovmf_code_paths:
        type: list
        elements: path
        description: Candidate OVMF code images for Fedora, Debian, Ubuntu, Arch and SUSE.
  destroy:
    short_description: Stop the guests and remove the run's files
    description:
      - Only stops processes whose command line names this run's guest, so a reused
        PID is skipped rather than killed. Succeeds when nothing was created.
    options:
      mp_qemu_stop_timeout:
        type: int
        default: 30
        description: Seconds to wait for a guest to exit after SIGTERM.
  prepare:
    short_description: Wait until each guest accepts an Ansible connection
    description:
      - Shows the end of the guest's serial log when the wait fails.
    options:
      mp_qemu_wait_timeout:
        type: int
        default: 300
        description: Seconds to wait for the connection.
  instance:
    short_description: Per-host guest settings (mp.qemu and mp_defaults.qemu)
    description:
      - Not a lifecycle entry point. Documents and validates the merged C(mp.qemu) dict.
    options:
      image:
        type: str
        required: true
        description:
          - URL or local path of a disk image in any format qemu-img reads.
          - C(.zip), C(.xz), C(.gz) and C(.bz2) images are unpacked first; the
            archive must hold one image named like the archive without its extension.
      image_checksum:
        type: str
        default: ""
        description: Checksum for the download, in M(ansible.builtin.get_url) C(checksum) format.
      cpus:
        type: int
        default: 2
        description: Virtual CPUs.
      memory:
        type: int
        default: 1024
        description: Memory in MiB.
      ssh_user:
        type: str
        default: cloud-user
        description: User created by cloud-init with the run's SSH key and passwordless sudo.
      firmware:
        type: str
        default: bios
        choices:
          - bios
          - uefi
        description: Boot firmware. C(uefi) needs OVMF on the controller.
      cpu_model:
        type: str
        default: ""
        description: QEMU C(-cpu) model. Empty selects C(host) under KVM and C(Nehalem) under TCG.
      disk_size:
        type: str
        default: ""
        description: Root disk size such as C(20G). Empty keeps the image's size; it cannot shrink.
      cloud_init:
        type: dict
        description: NoCloud seed contents.
        options:
          user_data:
            type: dict
            default: {}
            description:
              - Cloud-config merged over the generated management user. Lists such
                as C(users), C(runcmd) and C(write_files) are appended.
          network_data:
            type: dict
            default: {}
            description: Cloud-init network-config. Empty lets the guest use DHCP.
      data_disks:
        type: list
        elements: dict
        default: []
        description: Blank qcow2 disks, visible in the guest as C(/dev/disk/by-id/virtio-<name>).
        options:
          name:
            type: str
            required: true
            description: Disk name and serial.
          size:
            type: str
            required: true
            description: Size such as C(1G).
      extra_args:
        type: list
        elements: str
        default: []
        description:
          - Arguments appended verbatim to the QEMU command line, for extra NICs,
            port forwards or devices.
