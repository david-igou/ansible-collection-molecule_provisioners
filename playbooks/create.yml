---
- name: Create Molecule instances
  hosts: molecule
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - vars/controller.yml
  tasks:
    - name: Check the backend selection
      ansible.builtin.assert:
        that: mp_backend | default('') in mp_backends
        fail_msg: >-
          Set mp_backend to one of {{ mp_backends | join(', ') }}
          (got {{ mp_backend | default('nothing') }}).
        quiet: true

    - name: Create the instance
      ansible.builtin.include_role:
        name: david_igou.molecule_provisioners.{{ mp_backend }}
        tasks_from: create

    - name: Write the runtime inventory
      ansible.builtin.copy:
        content: >-
          {{ {'all': {'hosts': dict(ansible_play_hosts
               | zip(ansible_play_hosts | map('extract', hostvars, 'mp_runtime')))}}
             | to_nice_yaml }}
        dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_runtime.yml"
        mode: "0600"
      run_once: true

    - name: Load the runtime inventory
      ansible.builtin.meta: refresh_inventory
