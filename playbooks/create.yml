---
- name: Molecule provisioner — create
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert molecule group exists in inventory
      ansible.builtin.assert:
        that:
          - "'molecule' in groups"
          - groups['molecule'] | length > 0
        fail_msg: "Inventory must define a 'molecule' group with at least one host."

    - name: Determine backend from molecule group
      ansible.builtin.set_fact:
        _mp_backend: "{{ hostvars[groups['molecule'][0]].mp_backend | default(none) }}"

    # group_vars/molecule.yml is the documented home for mp_defaults, but this
    # play runs on localhost, which isn't in the molecule group — so that file
    # is out of scope here. Pull from the first molecule host's hostvars so
    # _spec_merge sees the consumer's overrides.
    - name: Pull mp_defaults from molecule group hostvars
      ansible.builtin.set_fact:
        mp_defaults: "{{ hostvars[groups['molecule'][0]].mp_defaults }}"
      when:
        - mp_defaults is not defined
        - hostvars[groups['molecule'][0]].mp_defaults is defined

    - name: Pull KubeVirt run isolation from molecule group hostvars
      ansible.builtin.set_fact:
        mp_kubevirt_run_isolation: "{{ hostvars[groups['molecule'][0]].mp_kubevirt_run_isolation }}"
      when:
        - _mp_backend == 'kubevirt'
        - mp_kubevirt_run_isolation is not defined
        - hostvars[groups['molecule'][0]].mp_kubevirt_run_isolation is defined

    - name: Validate backend
      ansible.builtin.assert:
        that: _mp_backend in mp_supported_backends
        fail_msg: >-
          mp_backend must be one of {{ mp_supported_backends | join(', ') }}
          (got '{{ _mp_backend or '(unset)' }}'). Set it in
          inventory/group_vars/molecule.yml.

    - name: Validate every host has the active backend block
      ansible.builtin.assert:
        that: hostvars[item].mp[_mp_backend] is defined
        fail_msg: "Host '{{ item }}' is missing mp.{{ _mp_backend }} in inventory."
      loop: "{{ groups['molecule'] }}"

    - name: Pull AWS role options from molecule group hostvars
      ansible.builtin.set_fact:
        __mp_aws_options_loaded: true
        mp_aws_wait_timeout: >-
          {{ mp_aws_wait_timeout | default(
             hostvars[groups['molecule'][0]].mp_aws_wait_timeout | default(omit)) }}
        mp_aws_windows_wait_timeout: >-
          {{ mp_aws_windows_wait_timeout | default(
             hostvars[groups['molecule'][0]].mp_aws_windows_wait_timeout | default(omit)) }}
        mp_aws_cleanup_timeout: >-
          {{ mp_aws_cleanup_timeout | default(
             hostvars[groups['molecule'][0]].mp_aws_cleanup_timeout | default(omit)) }}
        mp_aws_max_instances: >-
          {{ mp_aws_max_instances | default(
             hostvars[groups['molecule'][0]].mp_aws_max_instances | default(omit)) }}
        mp_aws_ssh_key_path: >-
          {{ mp_aws_ssh_key_path | default(
             hostvars[groups['molecule'][0]].mp_aws_ssh_key_path | default(omit)) }}
        mp_aws_print_diagnostic_tails: >-
          {{ mp_aws_print_diagnostic_tails | default(
             hostvars[groups['molecule'][0]].mp_aws_print_diagnostic_tails | default(omit)) }}
        mp_aws_role_defaults: >-
          {{ mp_aws_role_defaults | default(
             hostvars[groups['molecule'][0]].mp_aws_role_defaults | default(omit)) }}
      when: _mp_backend == 'aws'

    - name: Run provisioner create
      ansible.builtin.include_role:
        name: "david_igou.molecule_provisioners.{{ _mp_backend }}"
        tasks_from: create
