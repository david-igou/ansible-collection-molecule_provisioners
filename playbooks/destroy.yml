---
- name: Destroy Molecule instances
  hosts: molecule
  gather_facts: false
  vars_files:
    - vars/controller.yml
  tasks:
    - name: Destroy the instance
      ansible.builtin.include_role:
        name: david_igou.molecule_provisioners.{{ mp_backend }}
        tasks_from: destroy
      when: mp_backend | default('') in mp_backends
