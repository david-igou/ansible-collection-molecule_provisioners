---
- name: Molecule provisioner — destroy
  hosts: localhost
  connection: local
  gather_facts: false
  # Per-host mp.<backend> validation is intentionally absent here:
  # destroy is idempotent for hosts that were never created with the
  # active backend.
  tasks:
    - name: Assert molecule group exists in inventory
      ansible.builtin.assert:
        that:
          - "'molecule' in groups"
          - groups['molecule'] | length > 0
        fail_msg: "Inventory must define a 'molecule' group with at least one host."

    - name: Determine backend from molecule group
      ansible.builtin.set_fact:
        _mp_backend: "{{ hostvars[groups['molecule'][0]].mp_backend | default(none) }}"

    # group_vars/molecule.yml is the documented home for mp_defaults, but this
    # play runs on localhost, which isn't in the molecule group — so that file
    # is out of scope here. Pull from the first molecule host's hostvars so
    # _spec_merge sees the consumer's overrides.
    - name: Pull mp_defaults from molecule group hostvars
      ansible.builtin.set_fact:
        mp_defaults: "{{ hostvars[groups['molecule'][0]].mp_defaults }}"
      when:
        - mp_defaults is not defined
        - hostvars[groups['molecule'][0]].mp_defaults is defined

    - name: Validate backend
      ansible.builtin.assert:
        that: _mp_backend in mp_supported_backends
        fail_msg: >-
          mp_backend must be one of {{ mp_supported_backends | join(', ') }}
          (got '{{ _mp_backend or '(unset)' }}'). Set it in
          inventory/group_vars/molecule.yml.

    - name: Run provisioner destroy
      ansible.builtin.include_role:
        name: "david_igou.molecule_provisioners.{{ _mp_backend }}"
        tasks_from: destroy
