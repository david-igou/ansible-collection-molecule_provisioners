---
# Example inventory shape for david_igou.molecule_provisioners.
#
# Each host has `mp.podman`, `mp.kubevirt`, `mp.qemu`, and `mp.docker` blocks so
# the same inventory works under any backend. Switch backends at runtime by
# setting PROVISIONER=podman|kubevirt|qemu|docker — group_vars/molecule.yml maps
# that to mp_backend.

all:
  children:
    molecule:
      hosts:
        ubuntu-24:
          mp:
            podman:
              image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
              # Systemd-friendly knobs:
              # systemd: always
              # cgroupns: host
              # Common per-host knobs:
              # hostname: my-host
              # tty: true
              # etc_hosts:
              #   my-extra-host: 10.0.0.42
              # dns_servers:
              #   - 1.1.1.1
              # security_opts:
              #   - seccomp=unconfined
              # ulimits:
              #   - nofile=1024:2048
              # pid_mode: private
              # restart_policy: on-failure
              # restart_retries: 3
              # Network with a custom subnet:
              # podman_network:
              #   - name: my-net
              #     subnet: 10.89.0.0/24
              #     gateway: 10.89.0.1
              # CLI-level escape hatch (appended to `podman run` flags):
              # extra_opts:
              #   - --memory=512m
              #   - --cpus=2
              # Extra labels (merged with the default owner=molecule label):
              # labels:
              #   environment: ci
              #   project: my-collection
            kubevirt:
              boot_source:
                type: container_disk
                image: quay.io/containerdisks/ubuntu:24.04
              ssh_user: ubuntu
              # Managed disks require CDI and a compatible storage class.
              # boot_disk:
              #   bus: sata
              #   boot_order: 1
              # data_disks:
              #   - name: database
              #     size: 10Gi
              #     volume_mode: Filesystem
              #     access_modes:
              #       - ReadWriteOnce
              # application_ports:
              #   - name: http
              #     port: 80
              #     target_port: 8080
              # connection_vars:
              #   ansible_ssh_common_args: -o ProxyJump=test-bastion
              # Custom bootstrap keeps the generated SSH key by default.
              # cloud_init:
              #   user_data:
              #     packages:
              #       - python3
              #     hostname: molecule-guest
              # Primary definitions replace defaults; extra_* still append.
              # interfaces:
              #   - name: management
              #     masquerade: {}
              #     model: e1000
              # networks:
              #   - name: management
              #     pod: {}
              # Windows guest (WinRM-over-HTTPS). Clone a sysprep-generalized
              # golden via a DataSource, specialize it with a sysprep Secret
              # (unattend.xml), and connect over psrp as the unattend's admin.
              # NOTE: your scenario create.yml must create the sysprep Secret
              # BEFORE importing the create playbook — the VM starts immediately.
              # connection: psrp                 # ssh (default) | psrp | winrm
              # admin_user: Administrator
              # admin_password: "{{ lookup('ansible.builtin.env', 'WIN_ADMIN_PASSWORD') }}"
              # sysprep_secret: win2k25-sysprep
              # boot_source:
              #   type: data_volume_source_ref
              #   source_ref:
              #     name: win2k25
              #     namespace: openshift-virtualization-os-images
              #   size: 80Gi
              # memory: 8Gi
              # cpu:
              #   cores: 4
            qemu:
              image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
              ssh_user: ubuntu
              # Optional knobs:
              # cpus: 2
              # memory: 1024
              # firmware: uefi          # default 'bios'
              # cpu_model: Nehalem      # omitted/empty: host under KVM, Nehalem under TCG (BIOS and UEFI)
              # disk_size: 20G          # resizes overlay and grows root via cloud-init
            docker:
              image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
