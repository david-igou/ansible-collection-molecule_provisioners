---
# Example inventory shape for david_igou.molecule_provisioners.
#
# Each host has `mp.podman`, `mp.kubevirt`, and `mp.docker` blocks so the same
# inventory works under any backend. Switch backends at runtime by setting
# PROVISIONER=podman|kubevirt|docker — group_vars/molecule.yml maps that to
# mp_backend.

all:
  children:
    molecule:
      hosts:
        ubuntu-24:
          mp:
            podman:
              image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
              # Systemd-friendly knobs:
              # systemd: always
              # cgroupns: host
              # Common per-host knobs:
              # hostname: my-host
              # tty: true
              # etc_hosts:
              #   my-extra-host: 10.0.0.42
              # dns_servers: [1.1.1.1]
              # security_opts: [seccomp=unconfined]
              # ulimits: [nofile=1024:2048]
              # pid_mode: private
              # restart_policy: on-failure
              # restart_retries: 3
              # Network with a custom subnet:
              # podman_network:
              #   - name: my-net
              #     subnet: 10.89.0.0/24
              #     gateway: 10.89.0.1
              # CLI-level escape hatch (appended to `podman run` flags):
              # extra_opts:
              #   - --memory=512m
              #   - --cpus=2
            kubevirt:
              boot_source:
                type: container_disk
                image: quay.io/containerdisks/ubuntu:24.04
              ssh_user: ubuntu
            docker:
              image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
