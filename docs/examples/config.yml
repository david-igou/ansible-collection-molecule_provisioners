---
# Copy to extensions/molecule/config.yml. Molecule merges it into every
# scenario's molecule.yml when run from the collection root with
# MOLECULE_GLOB=extensions/molecule/*/molecule.yml (see the Makefile).
dependency:
  name: galaxy
  options:
    requirements-file: extensions/molecule/requirements-test.yml

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  playbooks:
    create: create.yml
    destroy: destroy.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
