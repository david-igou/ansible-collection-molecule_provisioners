---
# Every host in the molecule group becomes an instance. mp.<backend> holds
# settings for one host; shared settings belong in group_vars/molecule.yml.
all:
  children:
    molecule:
      hosts:
        server: {}
        client:
          mp:
            podman:
              env:
                ROLE: client
            qemu:
              memory: 2048
            kubevirt:
              memory: 2Gi
