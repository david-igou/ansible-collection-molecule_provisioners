---
namespace: david_igou
name: molecule_provisioners
version: 0.0.8-alpha
readme: README.md
authors:
  - David Igou <igou.david@gmail.com>

description: >-
  Molecule create, prepare and destroy playbooks for Podman, Docker, QEMU,
  KubeVirt and VMware vSphere instances, so scenarios describe their instances in inventory
  instead of copying provisioning playbooks.

license:
  - MIT
tags:
  - tools
  - molecule
  - testing
  - podman
  - docker
  - qemu
  - kubevirt
  - vmware

dependencies:
  ansible.windows: ">=2.5.0,<4.0.0" # win_ping when prepare reaches Windows guests
  community.crypto: ">=2.0.0"
  community.docker: ">=4.0.0"
  community.general: ">=10.1.0"
  community.vmware: ">=6.5.0,<7.0.0"
  containers.podman: ">=1.10.0"
  kubernetes.core: ">=3.0.0"

repository: https://github.com/david-igou/ansible-collection-molecule_provisioners
documentation: https://david-igou.github.io/ansible-collection-molecule_provisioners/
homepage: https://github.com/david-igou/ansible-collection-molecule_provisioners
issues: https://github.com/david-igou/ansible-collection-molecule_provisioners/issues

build_ignore:
  - .ansible
  - .ansible-lint
  - .build
  - .devcontainer
  - .github
  - .gitignore
  - .pre-commit-config.yaml
  - .prettierignore
  - .venv
  - .vscode
  - .yamllint
  - AGENTS.md
  - CLAUDE.md
  - changelogs/fragments
  - lint-requirements.txt
  - docs-requirements.txt
  - test-requirements.txt
